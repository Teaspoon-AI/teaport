\* check.sh --full, a manual gate before merging: sc_voice with the carry (#154) --
\* every commit but the backstop's leaves the next segment fed. Off in the default
\* run for its cost (see formal/README.md, the carry).
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 2
    CARRY = TRUE
    NUMBERED = TRUE
    MaxLag = 1
    MaxResets = 0
    RESET = "pays"
INVARIANTS
    TypeOK
    HoldIffPending
    DeferredIsHeld
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoCutVoice
