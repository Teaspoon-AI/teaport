\* SttSlot.tla, ARBITER = "one": the one SessionArbiter (#58 step 2) for every
\* front-end, with no connect retry: a release frees the arbiter's slot before the
\* engine's (a /talk session releases with no settle; a held conversation resumes
\* with none), so the retry is still load-bearing.
SPECIFICATION Spec
CONSTANTS
  GwSessions = {g1, g2}
  SipSessions = {p1}
  MODE = "fixedSettle"
  ARBITER = "one"
  ENDWAIT = "untimed"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT HolderAgrees
INVARIANT NoFalseBusy
CHECK_DEADLOCK FALSE
