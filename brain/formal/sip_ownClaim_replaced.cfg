SPECIFICATION Spec
CONSTANTS
  Calls = {c1, c2}
  MODE = "ownClaim"
  AUTO = FALSE
INVARIANT TypeOK
\* The claim fix's identity check alone (a teardown releases its own call's claim) keeps
\* NoUnclaimedCall but not this: a teardown cancelled in its settle never lets go, and a
\* teardown task still in flight holds the slot while the next call asks. The finally and
\* the bring-up's wait are what close it.
INVARIANT NoUnclaimedCall
INVARIANT NoReplacedCall
CHECK_DEADLOCK FALSE
