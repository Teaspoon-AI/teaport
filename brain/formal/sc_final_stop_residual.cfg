\* As shipped, on the wire as it is: every stale end is a mispairing and nothing else,
\* the turn always has a way to end, and the commit protocol's five properties hold
\* with the engine's own close in the environment.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 1
    MaxBackstops = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    StaleOnlyByMispairing
    NoStrandedTurn
