\* As shipped (receipts), against an engine WITHOUT the reason field (before
\* teagram-engine#36): every stale end is a mispairing and nothing else, the turn always
\* has a way to end, and the commit protocol's properties hold with the engine's own
\* close.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 0
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "unmarked"
    MaxCloses = 1
    MaxBackstops = 0
    VOICE = "pause"
    MaxVoice = 0
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    StaleOnlyByMispairing
    NoStrandedTurn
