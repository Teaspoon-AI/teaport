\* The mutant of the WINDOW: the injector waits only for nobody speaking (~user /\ ~bot),
\* the LLM not consulted. The shipped trigger fires on any completion's first text, so
\* an older completion's text spends the newer order: NoSilentLoss falls in 6 states
\* (FWaitIdle, FQueue, RunStart, FReplace, FirstText). The gate's ~llm (and q = 0, the
\* commit claim) is what makes "the completion that carried the order" true.
SPECIFICATION Spec
CONSTANTS MaxTurns = 3 MaxRuns = 3 MaxOrders = 2 WINDOW = "speech" MODE = "retireOnRead" LATCH = "turnAware"
INVARIANT TypeOK
INVARIANT NoSilentLoss
CHECK_DEADLOCK FALSE
