\* The same design against the closure properties: what it did right, what the
\* verdict design must keep doing, and what the no-verdict fallback keeps.
\* The carry (#154) is off here in the default run; sc_vadStop_sound_carry is this row with it
\* (check.sh --full).
SPECIFICATION Spec
CONSTANTS
    MODE = "vadStop"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    CARRY = FALSE
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoDoubleAnswer
    NoStaleClose
