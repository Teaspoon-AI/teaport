\* SttSlice.tla: the peek as shipped at ss_noPeekOwed's bounds (the --full run): _Peek.owed keeps a peek whose preview came while an earlier turn owed words waiting on its final. The only rows that guard that fix are this and ss_peek_freeze; at ss_peek's default bounds noPeekOwed holds too. ~31.4M states, ~8 min on two workers (measured by the 2026-11-05 audit's verifier).
SPECIFICATION Spec
CONSTANTS
  MaxPos = 4
  NWords = 2
  MaxCommits = 2
  MaxStops = 2
  QLen = 2
  PEEKS = TRUE
  WLEN = 1
  D = 3
  FREEZE = FALSE
  LOSSY = TRUE
  HEARD = "off"
  DESIGN = "shipped"
INVARIANT TypeOK
INVARIANT NoDoubleDeliver
CHECK_DEADLOCK FALSE
