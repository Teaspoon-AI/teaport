\* SttSlice.tla: the early settle as before audit S1: a late word below a settled turn is asked only of the first turn that vouches for anything. Three commits and a lossy preview: the first turn settles early on an empty preview, the second's preview misses the late word and vouches for another, the third's has it and delivers it; late, it goes to the open turn (fails NoDeliveredOpen; a fourth commit would deliver it again). No stops: without the peek the VAD's are no part of the slicing.
SPECIFICATION Spec
CONSTANTS
  MaxPos = 3
  NWords = 2
  MaxCommits = 3
  MaxStops = 0
  QLen = 2
  PEEKS = FALSE
  WLEN = 1
  D = 3
  FREEZE = FALSE
  LOSSY = TRUE
  HEARD = "off"
  EARLY = "first"
  DESIGN = "shipped"
INVARIANT TypeOK
INVARIANT NoDeliveredOpen
CHECK_DEADLOCK FALSE
