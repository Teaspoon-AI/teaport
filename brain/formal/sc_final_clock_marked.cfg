\* The same first cut with a wire that says which dones answer commits: the clock
\* rule falls on its own -- a done the engine sent on its own, stamped with its
\* arrival, is taken as the utterance under way.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "clock"
    DONES = "marked"
    MaxCloses = 1
    MaxBackstops = 1
INVARIANTS
    TypeOK
    NoStaleTurnEnd
