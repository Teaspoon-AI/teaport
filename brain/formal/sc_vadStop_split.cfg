\* The design stt.py shipped until #43: commit on the raw VAD stop -- since then only
\* the no-verdict fallback's, and this row is what that fallback costs. Kept for its
\* counterexample -- a pause the model calls INCOMPLETE splits the sentence into two
\* decodes, because the segment was closed before the verdict existed.
SPECIFICATION Spec
CONSTANTS
    MODE = "vadStop"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    CARRY = TRUE
    NUMBERED = TRUE
    MaxLag = 1
    MaxResets = 0
    RESET = "pays"
INVARIANTS
    TypeOK
    NoSplitOnIncomplete
