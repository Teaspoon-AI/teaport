\* The design stt.py shipped until #43: commit on the raw VAD stop. Kept for its
\* counterexample -- a pause the model calls INCOMPLETE splits the sentence into two
\* decodes, because the segment was closed before the verdict existed.
SPECIFICATION Spec
CONSTANTS
    MODE = "vadStop"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
INVARIANTS
    TypeOK
    NoSplitOnIncomplete
