\* As shipped: the STT stamps every close with the VAD stop it answers, by count, and
\* the strategy ends the turn only on the close of the stop in hand -- on the wire as
\* it is. FAILS on one cause only (sc_final_stop_residual): a done of the engine's own
\* taking a commit's place in the queue, which the engine's done does not let the STT
\* see. Kept as the counterexample the engine change would retire.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 1
    MaxBackstops = 1
INVARIANTS
    TypeOK
    NoStaleTurnEnd
