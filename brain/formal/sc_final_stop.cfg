\* The shipped design against an engine WITHOUT the reason field (before
\* teagram-engine#36): the STT stamps every close with the VAD stop it answers, by
\* count, and the strategy ends the turn only on the close of the stop in hand -- but
\* the wire does not say which done is the engine's own. FAILS on one cause only
\* (sc_final_stop_residual): a done of the engine's own taking a commit's place in the
\* queue. Kept for that engine; sc_final_stop_marked is the engine .234 runs now.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 1
    MaxBackstops = 1
INVARIANTS
    TypeOK
    NoStaleTurnEnd
