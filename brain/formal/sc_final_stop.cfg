\* teagram-engine#36): FAILS NoStaleTurnEnd on two causes -- a done of the engine's own
\* taking a commit's place in the queue (the pairing residual), and THE ORDER's (finding
\* A, sc_final_stop_marked), which TLC reaches first. Kept for that engine.
