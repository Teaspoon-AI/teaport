\* check.sh --full, a manual gate before merging: sc_vadStop_sound with the carry (#154) --
\* every commit but the backstop's leaves the next segment fed. Off in the default
\* run for its cost (see formal/README.md, the carry).
\* The same design against the closure properties: what it did right, what the
\* verdict design must keep doing, and what the no-verdict fallback keeps.
SPECIFICATION Spec
CONSTANTS
    MODE = "vadStop"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    CARRY = TRUE
    NUMBERED = FALSE
    MaxLag = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoDoubleAnswer
    NoStaleClose
