\* SttSlot.tla, ARBITER = "one": the one SessionArbiter (#58 step 2) for every
\* front-end, as shipped: the connect retries a rejection, and an ended holder lets
\* go within END_WAIT_SECS (the timing fact). Both busy properties hold.
SPECIFICATION Spec
CONSTANTS
  GwSessions = {g1, g2}
  SipSessions = {p1}
  MODE = "retryWhileBusy"
  ARBITER = "one"
  ENDWAIT = "untimed"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT HolderAgrees
INVARIANT NoFalseBusy
INVARIANT NoGrantedBusy
CHECK_DEADLOCK FALSE
