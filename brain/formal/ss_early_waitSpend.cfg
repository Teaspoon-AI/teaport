\* SttSlice.tla: the early settle as before audit S1: a word a kept turn takes by its stretch, which its preview lacked, is not spent from the later turn that vouched for it. Three words, three commits, lossy previews: the first turn is kept; the second settles early on an empty preview; the third's preview has the second and third words; the kept turn takes the second, which stays at the third turn's front, and the third word, late below the second turn, finds the front taken and goes to the open turn (fails NoDeliveredOpen). It needs three words, three commits and audio to 4; the rest is as small as reaches it, for the default run: words that end where they start (WLEN 0), every message taken before the next is sent (QLen 1), no stops.
SPECIFICATION Spec
CONSTANTS
  MaxPos = 4
  NWords = 3
  MaxCommits = 3
  MaxStops = 0
  QLen = 1
  PEEKS = FALSE
  WLEN = 0
  D = 2
  FREEZE = FALSE
  LOSSY = TRUE
  HEARD = "off"
  EARLY = "waitSpend"
  DESIGN = "shipped"
INVARIANT TypeOK
INVARIANT NoDeliveredOpen
CHECK_DEADLOCK FALSE
