\* sc_final_receipts with a lost verdict (MaxLost = 1) in place of the engine's own
\* close: the STT holds the stop whose verdict was lost to the hold's expiry, which
\* commits for it, and the final's protocol (the owed close, the receipts) must still
\* end the turn on its own words, and still end it (a scratch run with the expiry
\* disabled fails NoStrandedTurn here, and holds in sc_final_receipts). The default
\* run's one row that checks NoStaleTurnEnd and NoStrandedTurn with a verdict lost
\* (audit A5, 37k states); with the engine's close as well it is 1.1M states, and
\* sc_final_receipts_full (--full) has every fault at once.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "marked"
    MaxCloses = 0
    MaxBackstops = 0
    VOICE = "pause"
    MaxVoice = 0
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 1
    MaxResets = 0
    RESET = "pays"
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoStaleTurnEnd
    NoStrandedTurn
