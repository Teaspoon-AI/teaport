\* The final's protocol (PR #49), in its repaired design, under the wait for the
\* caller's pause (#140) on the engine that marks its dones: holding a complete
\* verdict's commit must not end a turn on stale words, nor leave a turn with no way
\* to end. The carry, the backstop and a lost verdict are sc_voice_final_carry's (--full).
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 0
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "marked"
    MaxCloses = 1
    MaxBackstops = 0
    VOICE = "pause"
    MaxVoice = 1
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    DeferredIsHeld
    NoCutVoice
    NoStaleTurnEnd
    NoStrandedTurn
