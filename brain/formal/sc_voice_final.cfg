\* The final's protocol (PR #49) under the wait for the caller's pause (#140), on the
\* engine that marks its dones: holding a complete verdict's commit must not end a turn
\* on stale words, nor leave a turn with no way to end.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "marked"
    MaxCloses = 1
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 1
INVARIANTS
    TypeOK
    HoldIffPending
    DeferredIsHeld
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoCutVoice
    NoStaleTurnEnd
    NoStrandedTurn
