SPECIFICATION Spec
CONSTANTS
  Convs = {"room"}
  Calls = {"c1"}
  ASKABLE = TRUE
  AUTO = FALSE
  SIP = "sequential"
  MODE = "awake"
INVARIANT TypeOK
\* The room is awake and stays so, so the wake race of sa_roomWakes cannot happen. The user
\* says yes and the hold fails (HoldFail): the room is ended, and must not be closed without
\* a word. Before the fix (2026-11-05, E2) this failed: Ask(yes), HoldFail,
\* HoldDone(CALL_IN), EndCall (a trace of 12 states). Now the end is HOLD_FAILED, which
\* _end_for tells an awake room about (the hold's own line, or the call line).
INVARIANT SttOnlyHolder OneConversation NoEngineRefusal NoClobber NoStrandedHold NoOrphanHold NoStuckAcquire NoSilentLiveEnd
CHECK_DEADLOCK FALSE
