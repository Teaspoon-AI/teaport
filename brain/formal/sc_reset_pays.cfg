\* As shipped since 2026-10-15: SegmentResetFrame carries the STT's stop count, and the
\* strategy takes the reset as the close of every stop the STT had seen -- it pays an
\* owed one among them, keeps receipts for those not counted yet, and finalizes what
\* _text holds. Every property, with one reset anywhere in the run.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 0
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "marked"
    MaxCloses = 0
    MaxBackstops = 0
    VOICE = "pause"
    MaxVoice = 0
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 1
    MaxResets = 1
    RESET = "pays"
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoStaleTurnEnd
    NoStrandedTurn
