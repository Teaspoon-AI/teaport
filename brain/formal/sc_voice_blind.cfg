\* Before #140: a complete verdict commits whatever the caller's voice is doing. The
\* caller starts again after a stop, the VAD's start has not come yet, and the
\* verdict's commit draws the boundary inside their words. Kept for the counterexample.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "blind"
    MaxVoice = 2
    CARRY = FALSE
    NUMBERED = FALSE
    MaxLag = 1
INVARIANTS
    TypeOK
    NoCutVoice
