\* SttSlice.tla: the early settle with the A3 fix (stt.py _early): a kept turn takes its stretch's late words and settles its final once the bounds pass it; a late word below a settled turn goes to a later turn that vouched for it. An early settle is incomplete by design (the backstop's accepted cost): its late words not delivered go to the next turn, so FinalComplete, NoDropAtCut and RightTurn are not checked here.
SPECIFICATION Spec
CONSTANTS
  MaxPos = 4
  NWords = 2
  MaxCommits = 2
  MaxStops = 2
  QLen = 2
  PEEKS = FALSE
  WLEN = 2
  D = 4
  FREEZE = FALSE
  LOSSY = FALSE
  HEARD = "off"
  EARLY = "kept"
  DESIGN = "shipped"
INVARIANT TypeOK
INVARIANT NoWordTwice
INVARIANT NoDoubleDeliver
INVARIANT NoDeliveredOpen
CHECK_DEADLOCK FALSE
