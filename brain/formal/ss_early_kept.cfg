\* SttSlice.tla: the early settle with the A3 fix (stt.py _early): the settled turn keeps its unspent vouched words until the bounds pass it. An early settle is incomplete by design (the backstop's accepted cost): FinalComplete and NoDropAtCut are not checked here.
SPECIFICATION Spec
CONSTANTS
  MaxPos = 4
  NWords = 2
  MaxCommits = 2
  MaxStops = 2
  QLen = 2
  PEEKS = FALSE
  WLEN = 2
  D = 4
  FREEZE = FALSE
  LOSSY = FALSE
  HEARD = "off"
  EARLY = "kept"
  DESIGN = "shipped"
INVARIANT TypeOK
INVARIANT NoWordTwice
INVARIANT RightTurn
INVARIANT NoDoubleDeliver
CHECK_DEADLOCK FALSE
