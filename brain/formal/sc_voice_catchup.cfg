\* The catch-up bound's accepted residual (#140): when the analyzer has not heard the
\* audio sent at the verdict within _VOICE_CATCHUP_SECS, the STT decides on what it has
\* heard, and voice in the unheard part is committed over. Kept so the cost stays visible.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 2
    CARRY = TRUE
INVARIANTS
    TypeOK
    NoCatchupCut
