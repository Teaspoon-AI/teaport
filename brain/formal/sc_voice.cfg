\* stt.py as shipped since #140: a complete verdict over the caller's voice holds the
\* segment for their pause, a VAD start or the bound. Every commit-protocol property,
\* with a lost verdict, a missed VAD stop, a turn closed under the ceiling and two
\* stretches of voice the VAD has not started on; NoOrphanedHold with the wait as
\* its escape.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 2
    MaxCarries = 1
INVARIANTS
    TypeOK
    HoldIffPending
    DeferredIsHeld
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoCutVoice
