\* stt.py as shipped since #140: a complete verdict over the caller's voice holds the
\* segment for their pause, a VAD start or the bound. Every commit-protocol property,
\* with a lost verdict, a turn closed under the ceiling and two stretches of voice the
\* VAD has not started on; NoOrphanedHold with the wait as its escape. The missed VAD
\* stop is sc_voice_missed's and the carry sc_voice_carry's (both check.sh --full).
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 2
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 1
    MaxResets = 0
    RESET = "pays"
INVARIANTS
    TypeOK
    HoldIffPending
    DeferredIsHeld
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoCutVoice
