\* check.sh --full, a manual gate before merging: sc_voice with the missed VAD stop
\* as well (MaxMissed = 1), the environment the default row ran in before THE ORDER
\* multiplied it (27.9 million states). The carry stays off.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 2
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 1
    MaxResets = 0
    RESET = "pays"
INVARIANTS
    TypeOK
    HoldIffPending
    DeferredIsHeld
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoCutVoice
