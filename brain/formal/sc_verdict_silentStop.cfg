\* The first cut of the verdict design (PR #45 before review): nothing reported when the
\* turn is closed under a running ceiling by something other than the ceiling. Every
\* property the model had held -- the expiry kept the segment from stranding and
\* answered the stop once -- and the STT held every such segment to that expiry and
\* logged a lost frame. Kept for the counterexample: NoOrphanedHold is what sees it.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "silent"
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
