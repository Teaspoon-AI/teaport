\* BEFORE NUMBERING (shipped until 2026-10-15), with the strategy up to three VAD edges
\* behind the VAD (THE ORDER: its input queue backed up behind Smart Turn's inference).
\* A verdict named no stop, so the STT took the stop before's COMPLETE for its pending
\* one and closed the segment under a stop the model then called INCOMPLETE. Faults
\* off: the point is the order. Kept as the regression row for NUMBERED.
