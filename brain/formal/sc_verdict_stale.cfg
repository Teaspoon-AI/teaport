\* stt.py as shipped, with the strategy up to three VAD edges behind the VAD (THE
\* ORDER: its input queue backed up behind Smart Turn's inference). A verdict names no
\* stop, so the STT takes the stop before's COMPLETE for its pending one and closes the
\* segment under a stop the model then calls INCOMPLETE. Faults off: the point is the
\* order.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 0
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    CARRY = FALSE
    NUMBERED = FALSE
    MaxLag = 3
INVARIANTS
    TypeOK
    NoSplitOnIncomplete
