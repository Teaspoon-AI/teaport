\* Control for sc_carry_reach: the same bounds with no carry, where no segment that
\* holds no utterance's words ever streams an interim.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    MaxCarries = 0
INVARIANTS
    TypeOK
    NoWordlessInterim
