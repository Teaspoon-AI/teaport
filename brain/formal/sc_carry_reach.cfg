\* Witness for the carry (#154): a segment that holds no utterance's words streams an
\* interim, which only a carry can feed with the engine's own close off (sc_carry_off
\* is the control). The rows that hold run with it, so its interims and the backstop
\* behind them are in their space.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 0
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    CARRY = TRUE
INVARIANTS
    TypeOK
    NoWordlessInterim
