\* stt.py as shipped (TEAPORT_STT_COMMIT_ON=verdict): commit on the verdict, hold on
\* INCOMPLETE. All four properties, with a lost verdict and a missed VAD stop in the
\* environment.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
