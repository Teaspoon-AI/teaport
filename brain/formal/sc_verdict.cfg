\* stt.py as shipped: commit on the verdict, hold on INCOMPLETE, and report a turn
\* closed under the ceiling. All five properties, with a lost verdict, a missed VAD
\* stop and a turn closed under the ceiling in the environment, and THE ORDER at a lag
\* of one edge either way. A deeper lag is sc_verdict_stale's.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    CARRY = TRUE
    NUMBERED = FALSE
    MaxLag = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
