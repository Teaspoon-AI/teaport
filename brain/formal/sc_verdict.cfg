\* stt.py as shipped (TEAPORT_STT_COMMIT_ON=verdict): commit on the verdict, hold on
\* INCOMPLETE, and report a turn closed under the ceiling. All five properties, with a
\* lost verdict, a missed VAD stop and a turn closed under the ceiling in the
\* environment.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
