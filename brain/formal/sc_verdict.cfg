\* stt.py as shipped: commit on the verdict, hold on
\* INCOMPLETE, and report a turn closed under the ceiling. All five properties, with a
\* lost verdict, a missed VAD stop and a turn closed under the ceiling in the
\* environment.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 1
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
