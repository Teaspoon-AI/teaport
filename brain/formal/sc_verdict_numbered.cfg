\* The proposed repair of sc_verdict_stale: TurnVerdictFrame names the stop it
\* answers and the STT ignores a verdict for any stop but its pending one. Every commit
\* property, at the same lag.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 0
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 3
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
