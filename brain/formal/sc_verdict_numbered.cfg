\* stt.py as shipped since 2026-10-15, the repair of sc_verdict_stale: TurnVerdictFrame
\* names the stop it answers (its stop_n, the strategy's count) and the STT ignores a
\* verdict for any stop but the one it is on. Every commit property, at the same lag.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 0
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "unmarked"
    MaxCloses = 0
    MaxBackstops = 1
    VOICE = "pause"
    MaxVoice = 0
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 3
    MaxResets = 0
    RESET = "pays"
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
