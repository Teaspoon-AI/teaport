\* As shipped, with the one-field engine change (a done says whether it answers a
\* client commit): no stale turn end at all, and everything else still holds.
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 1
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "stop"
    DONES = "marked"
    MaxCloses = 1
    MaxBackstops = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoStaleTurnEnd
    NoStrandedTurn
