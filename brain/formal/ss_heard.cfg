\* SttSlice.tla: the heard-out watch as shipped (stt.py _heard_through: the lesser of the two bounds), the bounds moving or frozen, two words, audio to 4, a word's end up to two steps past its start. No commits: a preview carries no word into what is in hand, and a turn only moves words within it, so the watch is checked on the engine's stream alone (~270k states).
SPECIFICATION Spec
CONSTANTS
  MaxPos = 4
  NWords = 2
  MaxCommits = 0
  MaxStops = 0
  QLen = 2
  PEEKS = FALSE
  WLEN = 2
  D = 4
  FREEZE = TRUE
  LOSSY = FALSE
  HEARD = "shipped"
  DESIGN = "shipped"
INVARIANT TypeOK
INVARIANT NoWordTwice
INVARIANT NoWordAfterHeard
CHECK_DEADLOCK FALSE
