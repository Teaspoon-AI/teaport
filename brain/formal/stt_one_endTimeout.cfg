\* SttSlot.tla, ARBITER = "one": the one SessionArbiter (#58 step 2) for every
\* front-end, as shipped, without the timing fact: _ending gives up on a holder after
\* END_WAIT_SECS and grants the newcomer while that holder's pipeline still holds
\* the engine.
SPECIFICATION Spec
CONSTANTS
  GwSessions = {g1, g2}
  SipSessions = {p1}
  MODE = "retryWhileBusy"
  ARBITER = "one"
  ENDWAIT = "timeout"
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT HolderAgrees
INVARIANT NoGrantedBusy
CHECK_DEADLOCK FALSE
