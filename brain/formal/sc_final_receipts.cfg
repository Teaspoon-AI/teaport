\* The proposed repair, on the marked engine: a close for a stop the strategy has not
\* counted yet is kept as a receipt, and a done nothing asked for that carries words pays
\* no stop (DESIGN = "receipts"); verdicts name their stop (NUMBERED). Every property,
\* with the engine's own close. Default run: no backstop, no lost verdict, no carry
\* (sc_final_receipts_backstop is the backstop's half; sc_final_receipts_full, --full,
\* all of them at once).
SPECIFICATION Spec
CONSTANTS
    MODE = "verdict"
    MaxStops = 2
    MaxLost = 0
    MaxMissed = 0
    TURNSTOP = "verdict"
    DESIGN = "receipts"
    DONES = "marked"
    MaxCloses = 1
    MaxBackstops = 0
    VOICE = "pause"
    MaxVoice = 0
    CARRY = FALSE
    NUMBERED = TRUE
    MaxLag = 1
INVARIANTS
    TypeOK
    HoldIffPending
    NoStrandedSegment
    NoSplitOnIncomplete
    NoDoubleAnswer
    NoStaleClose
    NoOrphanedHold
    NoStaleTurnEnd
    NoStrandedTurn
