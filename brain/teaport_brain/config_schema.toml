read = "startup"
tier = "installer"
help = "The setup network's WPA2 password, written at flash time so the paper insert can print it. 8 to 63 characters, each an ASCII letter, a digit, a space or one of - _ . @ ! # & * (the symbols the voice can name when it spells the password). Digits are easiest to say and type. Unset (or invalid): fresh random digits each setup, spoken aloud."
source = "wifi_setup.py:88"

[[settings]]
name = "WIFI_SETUP_SSID"
store = "wifi_setup_env"
group = "wifi_setup"
type = "string"
read = "startup"
tier = "installer"
help = "The setup network's name, for an insert printed before the MAC is known. Unset: teaport- and the last four hex digits of the Wi-Fi MAC. A name made only of hex digits (0-9, a-f) is ignored with a warning, and the MAC-based name used: some phones' QR scanners read such a name as raw bytes."
source = "wifi_setup.py:89"
