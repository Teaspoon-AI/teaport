# teaport configuration schema — the ONE table the config UI and the
# docs/CONFIG.md generator read. Drafted 2026-09-16 from the actual read sites
# in brain/teaport_brain/, install.sh, systemd/, cli/teaport and
# bridge/discord/index.js.
#
# A setting is not configurable until it has a row here. Adding an os.getenv()
# read without a row is the drift this file exists to stop.
#
# Fields per [[settings]] row:
#   name      the env var (or conf key for the sip store)
#   store     which file it lives in (see [stores])
#   group     section of the UI / docs (see [groups])
#   type      string | url | ws_url | path | dir | int | float | flag | enum | json | secret | snowflake
#   default   as the CODE parses it; absent = required or "unset means off"
#   required  true only for the handful the box cannot start without
#   read      "startup" = module-level constant fixed at ExecStart
#             "session" = read inside a per-session factory — the hot-reload candidates
#             "unit"    = consumed by the systemd unit's ExecStart, not by the process
#   tier      setup | tuning | diag | installer   (installer = read-only in the UI)
#   services  override of the store's services when only one reads it
#   unit      s | ms | dB | chars | frames | port | tokens
#   min/max   numeric bounds the UI enforces (code may or may not clamp)
#   values    enum values ("" allowed)
#   file      for secrets: the file the UI writes instead of the env var
#   accepts   for flags whose parser is NOT env_flag (LEDGER_TRACE)
#   help      one or two sentences; the docs generator copies it verbatim
#   note      operator-facing caveat, rendered after help
#   consumer  when a library, not our code, reads it (glibc, huggingface_hub)
#   source    file:line of the read, for the next person auditing this table

schema_version = 1

# ---------------------------------------------------------------- stores

[stores.engine_env]
path = "/etc/teaport/engine.env"
owner = "installer"
services = ["teaport-engine"]
apply = "systemctl restart teaport-engine — reloads Voxtral + Kokoro onto the GPU; both brains lose their engine session."

[stores.brain_env]
path = "/etc/teaport/brain.env"
owner = "installer+operator"
services = ["teaport-brain", "teaport-sip-brain"]
apply = "Talk brain: systemctl restart teaport-brain (drops the live Talk session). SIP brain: `teaport sip restart` — the gateway and the SIP brain together; a brain-only relaunch desyncs the gateway echo canceller."

[stores.sip_conf]
path = "~/.config/teaport/teaport-sip.conf"
owner = "teaport sip configure"
services = ["teaport-sip"]
format = "keyvalue"
mode = "600"
apply = "Edit it and `teaport sip restart` (or re-run `teaport sip configure`, which test-registers before it writes). `teaport sip aec on|off` flips the echo canceller and restarts the pair for you."

[stores.bridge_env]
path = "/etc/teaport/bridge.env"
owner = "installer"
services = ["teaport-discord-bridge"]
apply = "systemctl restart teaport-discord-bridge."

[stores.local_audio_env]
path = "/etc/teaport/local-audio.env"
owner = "installer+operator"
services = ["teaport-local-audio"]
apply = "systemctl restart teaport-local-audio (ends the local session; it redials the brain at once)."

[stores.wifi_setup_env]
path = "/etc/teaport/wifi-setup.env"
owner = "the image / flashing step"
services = ["teaport-wifi-setup"]
apply = "Read at each Wi-Fi setup (the unit runs only on request): nothing to restart. Written when the drive is flashed, so the paper insert can print the password; install.sh never writes it."

[stores.secrets]
path = "~/.config/teaport"
owner = "operator"
services = []
apply = "Read at the moment of use; the process env var of the same name shadows the file."

# ---------------------------------------------------------------- groups (UI/docs order)

[[groups]]
id = "llm"
title = "Language model"

[[groups]]
id = "engine"
title = "Speech engine connection"

[[groups]]
id = "tts_chunking"
title = "TTS clause chunking"
blurb = "First-audio latency versus seam quality. Each is explained at length in engine_tts.py."

[[groups]]
id = "turn_taking"
title = "Turn-taking"
blurb = "Each is explained at length where it is read, in endpointing.py."

[[groups]]
id = "agent"
title = "Agent consult and follow-ups"
blurb = "TEAPORT_AGENT says whether the box has a co-resident OpenClaw gateway; every other row here applies only when it does."

[[groups]]
id = "tools"
title = "Tools"
blurb = "One switch per tool the voice model can call (tools.py, THE TOOL CONTRACT). A tool also needs what it works with: the OpenClaw gateway (TEAPORT_AGENT=openclaw) for web, memory and ask_openclaw; the voice for the voice tools; and, for set_volume, restart_session and end_conversation, a client that can do it itself (the local audio bridge announces them; end_conversation only with wake words set). A tool that is off, or missing what it needs, is not offered to the model and not named in its instructions."

[[groups]]
id = "wifi_setup"
title = "Wi-Fi setup"
blurb = "Say \"set up Wi-Fi\" at the box (the local audio bridge) and it opens a temporary setup network, teaport-ab12 (the end of its Wi-Fi MAC), with a page where a phone picks the box's network and types the password; the box speaks the network, the password and the page's address. No LLM involved, so it works offline; and only offline does the phrase start it by itself — online, the model hears it like any other words and decides, through the wifi_setup tool (Tools), which is also its switch. These two are flash-time settings for the paper insert."

[[groups]]
id = "talk_client"
title = "Talk client context notes"
blurb = "Limits on the notes a Talk client adds to the voice LLM's context through the plugin's `teaport.talk.context` method (client_notes.py). Read only by teaport-brain."

[[groups]]
id = "sip_brain"
title = "SIP brain"
blurb = "Read only by teaport-sip-brain; the Talk brain ignores them."

[[groups]]
id = "diag"
title = "Diagnostics"
blurb = "All off by default; log-only."

[[groups]]
id = "installer"
title = "Installer-owned"
blurb = "Written by install.sh. Shown read-only."

[[groups]]
id = "engine_service"
title = "Speech engine service"

[[groups]]
id = "sip"
title = "SIP gateway"
blurb = "Written by `teaport sip configure`; see *SIP telephony (opt-in)* below for turning the line on."

[[groups]]
id = "bridge"
title = "Discord bridge"

[[groups]]
id = "local_audio"
title = "Local audio bridge"
blurb = "Talk to the agent through a sound card on the box (a USB mic array with a speaker on its jack). Opt-in: the unit stays inert until /etc/teaport/local-audio.env exists (`TEAPORT_ENABLE_LOCAL_AUDIO=1 ./install.sh`). It is a /talk client, and the brain holds one conversation at a time (docs/CONFIG.md, One engine, one conversation): it dials the brain when it starts, and after a session ends it redials only when someone speaks near it (LOCAL_AUDIO_WAKE_DB) — or, with wake words (LOCAL_AUDIO_WAKE_WORDS), it holds a session in which nothing the room says goes anywhere until a wake word is said. A dashboard (or other) Talk session takes the box only from a sleeping mic; while any other conversation is live the brain refuses the bridge (out loud if someone in the room asked to talk), and the bridge backs off while that conversation lasts (LOCAL_AUDIO_BACKOFF_SECS)."

# ================================================================ brain.env

# ---- llm

[[settings]]
name = "LLM_BASE_URL"
store = "brain_env"
group = "llm"
type = "url"
required = true
read = "session"
tier = "setup"
help = "Your OpenAI-compatible endpoint: https://api.groq.com/openai/v1, https://api.cerebras.ai/v1, https://openrouter.ai/api/v1, or http://127.0.0.1:8182/v1 for a local server."
note = "A value set here survives a re-run of install.sh unless that run is given one explicitly (the prompt, or TEAPORT_LLM_BASE_URL)."
source = "services.py:504"

[[settings]]
name = "LLM_API_KEY"
store = "brain_env"
group = "llm"
type = "secret"
file = "~/.config/teaport/llm_key"
read = "session"
tier = "setup"
help = "The key for that endpoint. A local server that ignores auth still needs a placeholder such as sk-local."
note = "Prefer the file; the env var, if set, wins over it."
source = "services.py:65"

[[settings]]
name = "LLM_MODEL"
store = "brain_env"
group = "llm"
type = "string"
default = "gpt-oss-120b"
read = "session"
tier = "setup"
help = "The served model name."
note = "A value set here survives a re-run of install.sh unless that run is given one explicitly (the prompt, or TEAPORT_LLM_MODEL)."
source = "services.py:515"

[[settings]]
name = "LLM_REASONING_EFFORT"
store = "brain_env"
group = "llm"
type = "enum"
values = ["low", "medium", "high", ""]
default = "low"
read = "session"
tier = "setup"
help = "Reasoning effort for models that support it. Set \"\" to disable for models that do not."
note = "low cuts gpt-oss's hidden chain-of-thought ~10x before the first spoken token. Also sets the LLM_MAX_TOKENS default."
source = "services.py:43"

[[settings]]
name = "LLM_MAX_TOKENS"
store = "brain_env"
group = "llm"
type = "int"
unit = "tokens"
min = 0
default_by = { LLM_REASONING_EFFORT = { low = 1024, medium = 3072, high = 8192, "" = 4096 } }
read = "session"
tier = "tuning"
help = "Completion cap. A credit-metered gateway reserves against the model's ceiling and refuses the request when the balance cannot cover it, however short the answer. Reasoning tokens bill as completion tokens. 0 = no cap, correct for a local or un-metered endpoint."
source = "services.py:135"

[[settings]]
name = "LLM_TIMEOUT_SECS"
store = "brain_env"
group = "llm"
type = "float"
unit = "s"
min = 1
default = 20
read = "session"
tier = "tuning"
help = "How long one completion attempt may take before it is abandoned. One retry follows, so the worst case before the failure is spoken is roughly twice this. Raise it for a slow local llama.cpp box."
note = "Without it the OpenAI SDK waits 600 s with no error, no log line and no audio."
source = "services.py:179"

[[settings]]
name = "LLM_EXTRA_BODY"
store = "brain_env"
group = "llm"
type = "json"
read = "session"
tier = "tuning"
help = "Optional JSON object merged into the request extra_body. OpenRouter routing example: {\"provider\":{\"order\":[\"Groq\"],\"allow_fallbacks\":true}}."
source = "services.py:55"

[[settings]]
name = "TEAPORT_LLM_TEXT_GUARD"
store = "brain_env"
group = "llm"
type = "flag"
default = true
read = "startup"
tier = "tuning"
help = "Fold degenerate unicode out of the model's replies and cut a runaway ellipsis collapse."
source = "llm_text_guard.py:123"

[[settings]]
name = "TEAPORT_LLM_GUARD_RECOVERY"
store = "brain_env"
group = "llm"
type = "string"
default = ""
read = "session"
tier = "tuning"
help = "The one line spoken when that guard trips. Empty = the built-in English line; override it for a non-English deployment."
source = "llm_text_guard.py:265"

[[settings]]
name = "TEAPORT_LLM_ERROR_SPEECH"
store = "brain_env"
group = "llm"
type = "flag"
default = true
read = "startup"
tier = "tuning"
help = "Say a short line out loud when the model call fails, instead of leaving the room silent."
source = "llm_error_speaker.py:50"

[[settings]]
name = "TEAPORT_LLM_ERROR_SPEECH_DEBOUNCE"
store = "brain_env"
group = "llm"
type = "float"
unit = "s"
min = 0
default = 30
read = "startup"
tier = "tuning"
help = "Seconds between spoken failure notices, so a failing endpoint is reported once per window rather than once per turn."
source = "llm_error_speaker.py:57"

[[settings]]
name = "TEAPORT_RAW_LLM_CAPTURE"
store = "brain_env"
group = "llm"
type = "flag"
default = true
read = "startup"
tier = "diag"
help = "Log a completion verbatim when it degenerates. Healthy turns log nothing."
source = "raw_llm_capture.py:54"

# ---- engine connection

[[settings]]
name = "TEAPORT_URL"
store = "brain_env"
group = "engine"
type = "ws_url"
default = "ws://127.0.0.1:8000/v1/realtime"
read = "startup"
tier = "installer"
help = "The engine realtime speech-to-text WebSocket. The installer derives it from ENGINE_PORT."
note = "A wrong value is the bot saying \"speech recognition isn't available\"."
source = "services.py:30"

[[settings]]
name = "ENGINE_TTS_URL"
store = "brain_env"
group = "engine"
type = "ws_url"
default = "ws://127.0.0.1:8000/v1/tts"
read = "startup"
tier = "installer"
help = "The engine text-to-speech base; the stream URL derives from it."
source = "engine_tts.py:52"

[[settings]]
name = "ENGINE_TTS_STREAM_URL"
store = "brain_env"
group = "engine"
type = "ws_url"
default = "<ENGINE_TTS_URL base>/v1/audio/speech/stream"
read = "startup"
tier = "installer"
help = "Only set to override the derivation from ENGINE_TTS_URL."
source = "engine_tts.py:53"

[[settings]]
name = "TTS_VOICE"
store = "brain_env"
group = "engine"
type = "string"
default = "af_heart"
read = "session"
tier = "setup"
help = "Kokoro voice id. A per-session choice from OpenClaw wins over this."
source = "services.py:547"

[[settings]]
name = "TTS_LANGUAGE"
store = "brain_env"
group = "engine"
type = "string"
read = "session"
tier = "setup"
help = "Kokoro language. A per-session choice from OpenClaw wins over this; unset = the engine default."
source = "services.py:548"

[[settings]]
name = "TTS_REMOTE_TIMEOUT"
store = "brain_env"
group = "engine"
type = "float"
unit = "s"
min = 1
default = 20
read = "startup"
tier = "tuning"
help = "Per-request receive timeout on the TTS stream. A clause synthesizes in ~0.2–0.5 s; 20 s covers a stuck engine without hanging a reply."
source = "engine_tts.py:54"

[[settings]]
name = "TTS_CONNECT_RETRIES"
store = "brain_env"
group = "engine"
type = "int"
min = 1
default = 3
read = "startup"
tier = "tuning"
help = "Connect attempts while the engine drains synth a barge-in abandoned (~1.5 s on an Orin Nano). Measured: 0/3 clauses survive with one attempt, 3/3 with three."
note = "The code clamps to at least 1; 0 or 1 both mean a single attempt."
source = "engine_tts.py:70"

[[settings]]
name = "TTS_CONNECT_BACKOFF"
store = "brain_env"
group = "engine"
type = "float"
unit = "s"
min = 0
default = 0.6
read = "startup"
tier = "tuning"
help = "Gap between those connect attempts."
source = "engine_tts.py:71"

[[settings]]
name = "TTS_STOP_FRAME_TIMEOUT_S"
store = "brain_env"
group = "engine"
type = "float"
unit = "s"
min = 1
default = 15
read = "startup"
tier = "tuning"
help = "Pipecat's stop-frame timeout. Its 3 s default trips in normal CPU-backend operation; 15 s covers the worst cap-sized chunk at CPU RTF ~0.6."
source = "engine_tts.py:96"

[[settings]]
name = "TEAPORT_STT_BACKEND"
store = "brain_env"
group = "engine"
type = "enum"
values = ["", "streaming"]
default = ""
read = "session"
tier = "diag"
help = "Experimental: streaming points the STT service at vLLM serving Voxtral Realtime. The incumbent engine is the default."
source = "services.py:564"

[[settings]]
name = "TEAPORT_STT_URL"
store = "brain_env"
group = "engine"
type = "ws_url"
default = "ws://127.0.0.1:8100/v1/realtime"
read = "session"
tier = "diag"
help = "Only with TEAPORT_STT_BACKEND=streaming."
source = "services.py:567"

[[settings]]
name = "TEAPORT_STT_MODEL"
store = "brain_env"
group = "engine"
type = "string"
default = "voxtral-realtime"
read = "session"
tier = "diag"
help = "Only with TEAPORT_STT_BACKEND=streaming."
source = "services.py:568"

[[settings]]
name = "TEAPORT_STREAM_TAIL_SECS"
store = "brain_env"
group = "engine"
type = "float"
unit = "s"
min = 0
default = 0.7
read = "startup"
tier = "diag"
help = "Only with the streaming backend."
source = "stt.py:266"

# ---- tts chunking

[[settings]]
name = "TTS_SENTENCE_SOFT_MAX"
store = "brain_env"
group = "tts_chunking"
type = "int"
unit = "chars"
min = 0
default = 80
read = "startup"
tier = "tuning"
help = "A sentence longer than this is split at clause boundaries before synthesis; first audio scales with the chunk's length, so one long sentence is the whole first-audio wait (a 236-char sentence began 4.6 s after the model finished it, on the 2026-09 engine and pre-#14 brain). 0 disables the split."
source = "engine_tts.py:135"

[[settings]]
name = "TTS_FIRST_CLAUSE_CHARS"
store = "brain_env"
group = "tts_chunking"
type = "int"
unit = "chars"
min = 8
default = 32
read = "startup"
tier = "tuning"
help = "Size of the first chunk — the one the caller waits on."
source = "engine_tts.py:117"

[[settings]]
name = "TTS_CLAUSE_GROWTH"
store = "brain_env"
group = "tts_chunking"
type = "float"
min = 1.0
max = 1.67
default = 1.5
read = "startup"
tier = "tuning"
help = "Each chunk may grow this many times the previous. Must stay below 1/RTF (~1.67 at the measured CPU RTF 0.6) or a chunk's synth outruns the previous chunk's playout and playback stalls at the seam."
source = "engine_tts.py:122"

[[settings]]
name = "TTS_CLAUSE_CAP"
store = "brain_env"
group = "tts_chunking"
type = "int"
unit = "chars"
min = 8
default = 200
read = "startup"
tier = "tuning"
help = "The largest ramped chunk."
source = "engine_tts.py:123"

[[settings]]
name = "TTS_CLAUSE_HARD_MAX"
store = "brain_env"
group = "tts_chunking"
type = "int"
unit = "chars"
min = 8
max = 450
default = 350
read = "startup"
tier = "tuning"
help = "Last-resort mid-sentence word break so a run-on cannot overflow the engine's ~512-token utterance limit and crash the synth."
source = "engine_tts.py:127"

[[settings]]
name = "TTS_SEAM_KEEP_LEAD"
store = "brain_env"
group = "tts_chunking"
type = "float"
unit = "s"
min = 0
default = 0.05
read = "startup"
tier = "tuning"
help = "Near-silence kept before a chunk's first sound."
source = "engine_tts.py:136"

[[settings]]
name = "TTS_SEAM_KEEP_TRAIL"
store = "brain_env"
group = "tts_chunking"
type = "float"
unit = "s"
min = 0
default = 0.25
read = "startup"
tier = "tuning"
help = "Near-silence kept after a chunk's last sound. With the lead this lands a seam near a sentence's natural ~320 ms comma pause instead of the ~793 ms a naive concat gives."
source = "engine_tts.py:137"

[[settings]]
name = "TTS_STREAM_AUDIO"
store = "brain_env"
group = "tts_chunking"
type = "flag"
default = true
read = "startup"
tier = "tuning"
help = "Play each engine audio chunk as it arrives (first audio sooner). Off buffers each sentence to its end, as before #14, and tells the engine to skip its eager prefix. Turn it off on a CPU-only engine or wherever synthesis runs slower than playout, where the early first block plays out before the rest of the sentence arrives and leaves a gap mid-sentence; the journal logs each such gap as \"TTS stream underrun\"."
source = "engine_tts.py:147"

[[settings]]
name = "TTS_USER_SPEECH_HOLD_MAX_S"
store = "brain_env"
group = "tts_chunking"
type = "float"
unit = "s"
min = 0
default = 3.0
read = "startup"
tier = "tuning"
help = "While VAD says the user is speaking, the next clause is held back to free the GPU for barge-in transcription. This caps the hold so sustained noise cannot stall the reply."
source = "engine_tts.py:163"

[[settings]]
name = "TTS_HOLD_ON_USER_SPEECH"
store = "brain_env"
group = "tts_chunking"
type = "flag"
default = true
read = "startup"
tier = "tuning"
help = "Hold the next clause while VAD hears the user, so STT gets the GPU (capped by TTS_USER_SPEECH_HOLD_MAX_S)."
source = "engine_tts.py:164"

[[settings]]
name = "TTS_PACING"
store = "brain_env"
group = "tts_chunking"
type = "enum"
values = ["greedy", "lead"]
default = "greedy"
read = "startup"
tier = "tuning"
help = "greedy submits each clause as soon as the previous one is synthesized. lead holds it until less than TTS_LEAD_S of synthesized audio is still unplayed, so the GPU idles for STT through most of the playout and a barge-in discards less synthesis."
note = "Measured 2026-10-04 on the appliance and an Orin NX (80 barge-ins each): no change in barge-in latency, since synthesis now runs ~30x real time; an interrupted reply discards ~3-5 s of synthesis instead of ~15-45 s."
source = "engine_tts.py:198"

[[settings]]
name = "TTS_LEAD_S"
store = "brain_env"
group = "tts_chunking"
type = "string"
default = "auto"
read = "startup"
tier = "tuning"
help = "With TTS_PACING=lead: seconds of unplayed audio to keep queued, or auto for max(1.5 s, 2x the next clause's synth time learned this session)."
source = "engine_tts.py:199"

[[settings]]
name = "TTS_EAGER"
store = "brain_env"
group = "tts_chunking"
type = "enum"
values = ["always", "first", "low_lead", "never"]
default = "always"
read = "startup"
tier = "tuning"
help = "Which clauses ask the engine for its eager prefix (an earlier first block, ~10% more synthesis): always, each reply's first clause, any clause submitted with less audio queued ahead of it than its own synth time (low_lead), or never. Ignored with TTS_STREAM_AUDIO off, which never asks."
source = "engine_tts.py:213"

[[settings]]
name = "TTS_CAPTION_LEAD_SECS"
store = "brain_env"
group = "tts_chunking"
type = "float"
unit = "s"
min = 0
default = 0.2
read = "startup"
tier = "tuning"
help = "Caption lead shared by the TTS word timestamps and the heard-word ledger. One knob so the two cannot drift."
source = "tts_text.py:323"

# ---- turn-taking

[[settings]]
name = "ENDPOINT_STOP_SECS"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 0.1
default = 0.5
read = "startup"
tier = "setup"
help = "Silence before the VAD reports the caller stopped. The dominant fixed latency on every turn; lower is snappier and cuts more mid-sentence pauses. With TEAPORT_STT_COMMIT_ON=verdict the transcript segment survives a pause Smart Turn calls unfinished, so this can come down toward pipecat's 0.2 where the verdicts are trustworthy (wideband audio); on telephony they are not, and the floor still does the work."
source = "endpointing.py:64"

[[settings]]
name = "SMARTTURN_STOP_SECS"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 0
default = 1.0
read = "startup"
tier = "tuning"
help = "How long a Smart Turn \"not done\" verdict holds the turn open, counted from the VAD stop. With TEAPORT_STT_COMMIT_ON=verdict the transcript segment is held open for the same wait, so a caller who resumes keeps one utterance. With TEAPORT_STT_COMMIT_ON=vad-stop and TEAPORT_SPECULATIVE_REPLY on, the reply is already being generated while this runs, so it can be raised (more patience for mid-sentence pauses) by up to the LLM's own latency at no cost to the turns that fall through."
source = "endpointing.py:91"

[[settings]]
name = "TEAPORT_SPECULATIVE_REPLY"
store = "brain_env"
group = "turn_taking"
type = "flag"
default = false
read = "startup"
tier = "tuning"
help = "Ask the LLM as soon as the final transcript lands on a turn Smart Turn has not concluded on (an INCOMPLETE verdict waiting out SMARTTURN_STOP_SECS), and use that reply if the turn then commits with exactly that text and nothing else touched the context. Off: the request waits for the commit. On: those turns answer up to the LLM's latency sooner, and a turn the caller resumes has spent one wasted request — every outcome logs a [SPEC] line with the running hit/miss tally. Needs TEAPORT_STT_COMMIT_ON=vad-stop to have a final to work on: under verdict the segment is held open through that wait and no final lands before the commit."
source = "speculate.py:74"

[[settings]]
name = "SMARTTURN_COMPLETE_THRESHOLD"
store = "brain_env"
group = "turn_taking"
type = "float"
min = 0
max = 1
default = 0.5
read = "startup"
tier = "tuning"
help = "The end-of-turn probability that counts as done. Near-inert on telephony audio."
source = "endpointing.py:110"

[[settings]]
name = "VAD_CONFIDENCE"
store = "brain_env"
group = "turn_taking"
type = "float"
min = 0
max = 1
default = 0.7
read = "startup"
tier = "tuning"
help = "Silero's speech-probability gate."
source = "endpointing.py:144"

[[settings]]
name = "VAD_MIN_VOLUME"
store = "brain_env"
group = "turn_taking"
type = "float"
min = 0
max = 1
default = 0.6
read = "startup"
tier = "tuning"
help = "Silero's volume gate."
source = "endpointing.py:145"

[[settings]]
name = "VAD_SAMPLE_RATE"
store = "brain_env"
group = "turn_taking"
type = "enum"
values = ["16000", "8000"]
default = "16000"
read = "startup"
tier = "tuning"
help = "8000 runs Silero on the true narrowband signal when the trunk is G.711; 16000 is the gateway's upsample."
source = "endpointing.py:738"

[[settings]]
name = "TEAPORT_INTERRUPT_MIN_WORDS"
store = "brain_env"
group = "turn_taking"
type = "int"
min = 1
default = 2
read = "startup"
tier = "setup"
help = "Transcribed words needed to interrupt the bot. 1 makes every word a barge-in, backchannels included. On SIP, while the barge-in pause has the bot paused, an utterance made only of TEAPORT_STOP_WORDS interrupts at any length, and once the paused reply would have finished anyway one word is enough."
source = "endpointing.py:159"

[[settings]]
name = "TEAPORT_REPLY_HOLD"
store = "brain_env"
group = "turn_taking"
type = "flag"
read = "startup"
tier = "diag"
help = "Retired, never shipped in a release: the reply hold is set per front-end by TEAPORT_REPLY_HOLD_SIP and TEAPORT_REPLY_HOLD_TALK. If it is still set, the brain ignores it and logs a warning saying so."
source = "reply_hold.py:129"

[[settings]]
name = "TEAPORT_REPLY_HOLD_SIP"
store = "brain_env"
group = "turn_taking"
type = "flag"
default = true
read = "startup"
tier = "tuning"
services = ["teaport-sip-brain"]
help = "Phone calls: before a reply to the caller's turn starts playing, check the line. If they have started talking again since the turn was committed, hold the reply; if their new words arrive, drop it and answer the whole turn as one message; if none come (a cough), play it TEAPORT_REPLY_HOLD_RELEASE_S after they go quiet. A caller who stays quiet is never delayed."
source = "reply_hold.py:127"

[[settings]]
name = "TEAPORT_REPLY_HOLD_TALK"
store = "brain_env"
group = "turn_taking"
type = "flag"
default = false
read = "startup"
tier = "tuning"
services = ["teaport-brain"]
help = "The same reply hold for the OpenClaw Talk path. Off until a Talk session has been measured with it: the only measurement so far is a telephony call."
source = "reply_hold.py:128"

[[settings]]
name = "TEAPORT_REPLY_HOLD_RELEASE_S"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 0
default = 1.0
read = "startup"
tier = "tuning"
help = "How long a held reply waits for the caller's words once the line is quiet -- the VAD's stop and the fast onset test's offset, whichever is later -- before it plays anyway. So it is about ENDPOINT_STOP_SECS more than this after the speech ends."
source = "reply_hold.py:139"

[[settings]]
name = "TEAPORT_REPLY_HOLD_MAX_S"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 0
default = 6.0
read = "startup"
tier = "tuning"
help = "The longest a reply is ever held, from the start of the hold, whatever the VAD says. Raised to TEAPORT_REPLY_HOLD_RELEASE_S if set lower."
source = "reply_hold.py:142"

[[settings]]
name = "TEAPORT_REPLY_HOLD_ONSET_MAX_S"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 0
default = 2.5
read = "startup"
tier = "tuning"
help = "The cap for a hold only the fast onset test asked for (no VAD start in it). That test has no volume gate, so steady room noise above its threshold would otherwise hold every reply to TEAPORT_REPLY_HOLD_MAX_S. Never more than that, never less than TEAPORT_REPLY_HOLD_RELEASE_S."
source = "reply_hold.py:144"

[[settings]]
name = "TEAPORT_ONSET_CONFIDENCE"
store = "brain_env"
group = "turn_taking"
type = "float"
min = 0
max = 1
default = 0.6
read = "startup"
tier = "tuning"
help = "Silero confidence that counts toward the fast speech-onset signal the reply hold (and, on SIP, the barge-in pause) uses. Below VAD_CONFIDENCE on purpose, and with no volume gate: it only has to say speech has begun, soon. It changes nothing the VAD decides."
source = "speech_onset.py:36"

[[settings]]
name = "TEAPORT_ONSET_MIN_MS"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "ms"
min = 32
default = 128
read = "startup"
tier = "tuning"
help = "Consecutive speech at TEAPORT_ONSET_CONFIDENCE that makes an onset (32 ms per Silero chunk, rounded up)."
source = "speech_onset.py:38"

[[settings]]
name = "TEAPORT_BARGE_PAUSE"
store = "brain_env"
group = "turn_taking"
type = "flag"
default = true
read = "startup"
tier = "tuning"
help = "SIP only: the moment the caller starts talking over the bot (the fast speech-onset test, or the VAD), pause playout. If their words follow, the barge-in cancels the reply as before; if none come within TEAPORT_BARGE_PAUSE_RESUME_S of them stopping, the reply resumes from where it paused. No effect on Talk, whose relay can only clear its client's buffer."
source = "barge_pause.py:123"

[[settings]]
name = "TEAPORT_BARGE_PAUSE_RESUME_S"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 0
max = 8
default = 0.8
read = "startup"
tier = "tuning"
help = "The longest a paused reply waits, after the caller goes quiet, for their words before it resumes (sooner once the STT has closed that speech with no turn in it). With the VAD's own stop delay a cough stalls the bot about ENDPOINT_STOP_SECS + this. At most 8."
source = "barge_pause.py:128"

[[settings]]
name = "TEAPORT_BARGE_PAUSE_MAX_S"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 0
max = 8
default = 6.0
read = "startup"
tier = "tuning"
help = "The longest one pause lasts before the reply resumes anyway. Capped at 8 s: a write held past pipecat's 10 s deadline loses the call its voice."
source = "barge_pause.py:132"

[[settings]]
name = "TEAPORT_STOP_WORDS"
store = "brain_env"
group = "turn_taking"
type = "string"
default = "stop,wait,hold on,hold,pause,enough,quiet,shh,shush"
read = "startup"
tier = "tuning"
help = "Comma-separated words or phrases that end a reply on their own while it is paused for the caller's speech, whatever TEAPORT_INTERRUPT_MIN_WORDS says (with the bot silent there is no echo to garble into one). Only an utterance made entirely of them counts, so \"don't stop\" does not; any \"shh\" spelling is shh. \"No\" is left out on purpose: over the bot it is as often an answer as an objection."
source = "barge_pause.py:141"

[[settings]]
name = "TEAPORT_STRANDED_INTERIM_SECS"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 0.2
default = 1.5
read = "startup"
tier = "tuning"
help = "Commit a segment ourselves after this much interim quiet with no VAD stop, so a missed stop loses a second rather than the turn."
source = "stt.py:253"

[[settings]]
name = "TEAPORT_STT_COMMIT_ON"
store = "brain_env"
group = "turn_taking"
type = "enum"
values = ["verdict", "vad-stop"]
default = "verdict"
read = "startup"
tier = "tuning"
help = "What closes the transcript segment and forces the final. verdict: Smart Turn's answer to the VAD stop — done commits at once, not-done holds the segment open until the turn is judged complete, so a mid-sentence pause keeps one utterance instead of splitting it into two context-free decodes; the model's inference (~0.1 s) is then on the commit path, which lowering ENDPOINT_STOP_SECS more than pays for where the verdicts are trustworthy. vad-stop: the raw VAD stop, before the verdict exists (the behaviour before issue #43); a turn that falls through SMARTTURN_STOP_SECS gets its final ~0.8 s sooner, and TEAPORT_SPECULATIVE_REPLY needs this. Either way a VAD stop while the bot is speaking commits at once — that flush is the barge-in."
source = "stt.py:154"

[[settings]]
name = "TEAPORT_STT_SILENCE_HINT"
store = "brain_env"
group = "turn_taking"
type = "flag"
default = true
read = "startup"
tier = "tuning"
help = "Tell the engine, on each commit, how much trailing silence the VAD has already established (the stop's silence window plus everything sent since), so it can shorten the fixed ~1 s padding it decodes before answering. The engine takes the larger of this and its own count, clamped to what it has; one without the field's support ignores it. Off: the engine credits only what its own VAD counted, which on a phone line is often nothing."
source = "stt.py:221"

[[settings]]
name = "TEAPORT_STT_SILENCE_HINT_MARGIN_MS"
store = "brain_env"
group = "turn_taking"
type = "int"
unit = "ms"
min = 0
default = 100
read = "startup"
tier = "tuning"
help = "Held back from the silence hint, for the tail the VAD's confidence gate drops before the decoder is done with it. Over-claiming by up to 240 ms cost nothing on the engine's measured corpus; 400 ms truncated the last word on 7 of 30 utterances."
source = "stt.py:222"

[[settings]]
name = "HEARD_MODE"
store = "brain_env"
group = "turn_taking"
type = "enum"
values = ["truncate", "note"]
default = "truncate"
read = "startup"
tier = "tuning"
help = "How the context records a reply the caller only partly heard: truncate it to what was heard, or keep it whole with a note."
source = "heard_context.py:32"

[[settings]]
name = "TEAPORT_SILENT_TURN_SECS"
store = "brain_env"
group = "turn_taking"
type = "float"
unit = "s"
min = 1
default = 12
read = "startup"
tier = "diag"
help = "How long a committed turn may produce no audio before it is reported in the journal. A turn waiting on an agent consult is not counted."
source = "turn_timing.py:35"

# ---- agent consult

[[settings]]
name = "TEAPORT_AGENT"
store = "brain_env"
group = "agent"
type = "enum"
values = ["openclaw", "none"]
default = "openclaw"
read = "startup"
tier = "setup"
help = "Which agent, if any, is co-resident. `openclaw`: a gateway (host OpenClaw or a NemoClaw sandbox) provides web_search, web_fetch, search_memory, remember, ask_openclaw, memory recall and the workspace persona. `none`: a voice-only box — those tools are not advertised, recall is not run, and the persona comes from TEAPORT_PERSONA_FILE. Asymmetric on repair: a detected gateway is positive evidence, so the installer writes `openclaw` unconditionally (installing a gateway later and re-running is all it takes to turn the tools on) — but NOT finding one is not evidence of anything, so the installer only seeds `none` on a first voice-only install and an existing value survives a repair. To disable agent tooling on a box that still has a working gateway, use the config page, not a hand edit of this file — a repair that still finds the gateway overwrites a hand edit here (and now logs that it did)."
source = "agent_backend.py:32"

[[settings]]
name = "OPENCLAW_GATEWAY_URL"
store = "brain_env"
group = "agent"
type = "url"
default = "http://127.0.0.1:18789"
read = "startup"
tier = "installer"
help = "The co-resident gateway for shared persona and memory recall. The installer sets it from the gateway port."
source = "openclaw_client.py:34"

[[settings]]
name = "OPENCLAW_GATEWAY_TOKEN"
store = "brain_env"
group = "agent"
type = "secret"
file = "~/.config/teaport/openclaw_token"
read = "session"
tier = "setup"
help = "Bearer token for that gateway."
note = "Prefer the file; the env var, if set, wins over it."
source = "openclaw_client.py:98"

[[settings]]
name = "OPENCLAW_AGENT_ID"
store = "brain_env"
group = "agent"
type = "string"
default = "main"
read = "startup"
tier = "tuning"
help = "The agent consulted."
source = "openclaw_client.py:78"

[[settings]]
name = "OPENCLAW_BIN"
store = "brain_env"
group = "agent"
type = "path"
read = "startup"
tier = "installer"
help = "The openclaw CLI used as the consult fallback. Auto-detected; the host may have none when OpenClaw runs only inside the sandbox."
source = "openclaw_client.py:65"

[[settings]]
name = "TEAPORT_AGENT_FIRST"
store = "brain_env"
group = "agent"
type = "flag"
default = false
read = "startup"
tier = "setup"
help = "Agent-first routing: install the strict router directive and drop the \"I'll work on that\" ack."
source = "tools.py:72"

[[settings]]
name = "TEAPORT_RECALL_TIMEOUT"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 0.1
default = 1.5
read = "startup"
tier = "tuning"
help = "Memory-recall budget. Never awaited on the frame path, so a generous value adds no turn latency; 1.5 s clears a cold embedder (~1.14 s measured on-box)."
source = "openclaw_client.py:50"

[[settings]]
name = "TEAPORT_CONSULT_TIMEOUT"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 5
default = 45
read = "startup"
tier = "tuning"
help = "Gateway/CLI consult ceiling on the synchronous path (TEAPORT_AGENT_FIRST, or a client with no follow-up injector). Otherwise the async path, SIP included, uses TEAPORT_ASYNC_CONSULT_TIMEOUT instead. The sandbox-exec shim adds ~14 s of spawn tax before the agent turn even starts."
source = "openclaw_client.py:85"

[[settings]]
name = "TEAPORT_NATIVE_CONSULT_ACK_TIMEOUT"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 0.2
default = 1.5
read = "startup"
tier = "tuning"
help = "No ack within this means no native runner: fall back fast instead of burning the full window. A live relay acks within moments; the Discord bridge never acks."
source = "tools.py:395"

[[settings]]
name = "TEAPORT_NATIVE_CONSULT_TIMEOUT"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 5
default = 45
read = "startup"
tier = "tuning"
help = "How long to wait on an acked native consult. Useful consults return in ~15–30 s; past ~45 s the voice wait degrades faster than the answer improves."
source = "tools.py:390"

[[settings]]
name = "TEAPORT_ASK_OPENCLAW_TIMEOUT"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 5
default = 55
read = "startup"
tier = "tuning"
help = "The function-call timeout for ask_openclaw. Must exceed ack + native consult or pipecat abandons the call and drops the late answer. Bounds the sync path only."
source = "tools.py:400"

[[settings]]
name = "TEAPORT_ASYNC_CONSULT_TIMEOUT"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 5
default = 130
read = "startup"
tier = "tuning"
help = "Async consult ceiling, for every lane: the native Talk consult and the gateway/CLI fallback (SIP). The consult runs off the turn; the answer is spoken as an unprompted follow-up when it lands, or a \"that took too long\" past this. Sized just past the Control UI's own hard 120 s consult wait, after which no Talk result can arrive."
source = "tools.py:413"

[[settings]]
name = "TEAPORT_FOLLOWUP_QUIET_S"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 0
default = 0.7
read = "startup"
tier = "tuning"
help = "How long the conversation must stay quiet before a follow-up window counts; rejects mid-thought pauses and between-turn gaps."
source = "followup_gate.py:44"

[[settings]]
name = "TEAPORT_FOLLOWUP_MAX_WAIT_S"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 1
default = 60
read = "startup"
tier = "tuning"
help = "Ceiling on holding a follow-up for a gap; past this, speak anyway."
source = "followup_gate.py:46"

[[settings]]
name = "TEAPORT_FOLLOWUP_MIN_HEARD"
store = "brain_env"
group = "agent"
type = "float"
min = 0
max = 1
default = 0.3
read = "startup"
tier = "tuning"
help = "Fraction of a delegated answer the caller must have heard before it counts as delivered; below it, the answer is said again at the next quiet moment."
source = "agent_session.py:214"

[[settings]]
name = "TEAPORT_THINKING_SOUND"
store = "brain_env"
group = "agent"
type = "flag"
default = true
read = "startup"
tier = "setup"
help = "The typing bed during a long agent consult."
source = "thinking_sound.py:44"

[[settings]]
name = "TEAPORT_THINKING_GRACE_S"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 0
default = 1.5
read = "startup"
tier = "tuning"
help = "Silence before the bed starts."
source = "thinking_sound.py:48"

[[settings]]
name = "TEAPORT_THINKING_GAIN"
store = "brain_env"
group = "agent"
type = "float"
min = 0
max = 1
default = 0.8
read = "startup"
tier = "tuning"
help = "Bed level; 1.0 is the synthesized peak."
