[[settings]]
name = "TEAPORT_THINKING_MAX_S"
store = "brain_env"
group = "agent"
type = "float"
unit = "s"
min = 1
default = 60
read = "startup"
tier = "tuning"
help = "Hard cap on the bed. Keep it above TEAPORT_ASK_OPENCLAW_TIMEOUT."
