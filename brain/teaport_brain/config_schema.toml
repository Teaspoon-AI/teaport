# ---------------------------------------------------------------- cross-row constraints
# kind = "sum_lt": a < b + c ... ; "lt": a < b ; "le_chain": a ≤ b ≤ c ; "follows": changing a requires rewriting b…

[[constraints]]
kind = "sum_lt"
lhs = ["TEAPORT_NATIVE_CONSULT_ACK_TIMEOUT", "TEAPORT_NATIVE_CONSULT_TIMEOUT"]
rhs = "TEAPORT_ASK_OPENCLAW_TIMEOUT"
message = "TEAPORT_ASK_OPENCLAW_TIMEOUT must exceed the ack + native consult timeouts, or pipecat drops the late answer."

[[constraints]]
kind = "lt"
lhs = "TEAPORT_ASK_OPENCLAW_TIMEOUT"
rhs = "TEAPORT_THINKING_MAX_S"
message = "TEAPORT_THINKING_MAX_S should stay above TEAPORT_ASK_OPENCLAW_TIMEOUT so the bed outlasts the consult."

[[constraints]]
kind = "le_chain"
names = ["TTS_FIRST_CLAUSE_CHARS", "TTS_CLAUSE_CAP", "TTS_CLAUSE_HARD_MAX"]
message = "First clause ≤ clause cap ≤ hard max."

[[constraints]]
kind = "follows"
lhs = "ENGINE_PORT"
rhs = ["TEAPORT_URL", "ENGINE_TTS_URL"]
message = "Changing ENGINE_PORT means rewriting TEAPORT_URL and ENGINE_TTS_URL in brain.env."

[[constraints]]
kind = "follows"
lhs = "BRAIN_PORT"
rhs = ["BRAIN_URL"]
message = "Changing BRAIN_PORT means rewriting BRAIN_URL in bridge.env, the plugin config and Caddy."

[[constraints]]
kind = "follows"
lhs = "GATEWAY_TOKEN"
rhs = []
message = "GATEWAY_TOKEN is mirrored into the plugin config by install.sh; change both or neither."

# ================================================================ local-audio.env

[[settings]]
name = "LOCAL_AUDIO_DEVICE"
store = "local_audio_env"
group = "local_audio"
type = "string"
default = "hw:CARD=Array,DEV=0"
read = "startup"
tier = "setup"
help = "The ALSA device for both the mic and the speaker. It must do 16 kHz stereo S16_LE both ways. The default names a ReSpeaker XVF3800 by its card id; `arecord -l` lists the others."
source = "local_audio.py:116"

[[settings]]
name = "LOCAL_AUDIO_CAPTURE_CHANNEL"
store = "local_audio_env"
group = "local_audio"
type = "int"
default = 0
min = 0
max = 1
read = "startup"
tier = "tuning"
help = "Which capture channel is the mic. On the XVF3800, 0 is the echo-cancelled conversation beam and 1 the ASR-tuned beam."
source = "local_audio.py:117"

[[settings]]
name = "LOCAL_AUDIO_WAKE_DB"
store = "local_audio_env"
group = "local_audio"
type = "float"
default = -40.0
min = -70.0
max = 0.0
unit = "dB"
read = "startup"
tier = "tuning"
help = "Without wake words: how loud (dBFS RMS on the capture channel) a voice in the room must be to reconnect after a session ended. The bridge dials the brain at start, then waits for ~0.26 s of sound above this before dialling again, so it never dials into a busy box on a timer. The XVF3800's room measured about -50 dBFS idle. Raise it if noise reconnects, lower it if speech does not."
source = "local_audio.py:138"

[[settings]]
name = "LOCAL_AUDIO_WAKE_WORDS"
store = "local_audio_env"
group = "local_audio"
type = "string"
read = "startup"
tier = "setup"
help = "Wake words for the box's own mic, comma-separated, in any language the speech engine hears (e.g. `hey teaport, tea port, привет чайник`). Set, the box's speech recognition hears the room but every word is dropped, inside the brain's STT, before it can reach the model, the agent, a caption or a log — until a phrase from this list is said. Then what was said after it is the first turn (\"hey teaport, what's the weather\"), and the conversation needs no wake word until it sleeps again (LOCAL_AUDIO_KEEPALIVE_SECS, LOCAL_AUDIO_AWAKE_MAX_SECS, or \"go to sleep\"). Matching ignores case, punctuation and spacing but is otherwise exact: list the spellings you want (\"teaport, tea port\"); \"teapot\" wakes it only if listed. Empty: no wake words, the voice wake (LOCAL_AUDIO_WAKE_DB). SIP calls and dashboard/browser Talk sessions never need them."
note = "Any value at all means wake mode, and it fails closed: if the brain or its speech recognition cannot be reached the bridge stays deaf and retries; it never falls back to listening without the wake words. While asleep the engine's speech recognition runs on the room (the GPU stays busy, one STT session held); a phone call takes it over (the bridge stays off until the call ends), but a call that lands DURING a conversation at the box still hears the busy line (until issue #58's take-the-call prompt)."
source = "local_audio.py:145"

[[settings]]
name = "LOCAL_AUDIO_KEEPALIVE_SECS"
store = "local_audio_env"
group = "local_audio"
type = "float"
default = 45.0
min = 5.0
max = 3600.0
unit = "s"
read = "startup"
tier = "tuning"
help = "With wake words: the conversation sleeps once nobody (you or the agent) has spoken for this long. Its session ends — the pipeline, the speech engine and the mic all go — and the box waits for a wake word again; the conversation itself is kept for LOCAL_AUDIO_CONVERSATION_SECS. Without wake words the session stays up, but after this long with nobody speaking (and until the first time someone does) it counts as a sleeping mic: a Talk client that connects takes the box from it quietly instead of being told the agent is busy."
source = "local_audio.py:149"

[[settings]]
name = "LOCAL_AUDIO_AWAKE_MAX_SECS"
store = "local_audio_env"
group = "local_audio"
type = "float"
default = 300.0
min = 30.0
max = 86400.0
unit = "s"
read = "startup"
tier = "tuning"
help = "With wake words: the conversation also sleeps this long after the last wake word, once the agent is not speaking — so a TV or a chat in the room that the agent keeps answering cannot hold it awake for good. Say the wake word again to keep going."
source = "local_audio.py:150"

[[settings]]
name = "LOCAL_AUDIO_CONVERSATION_SECS"
store = "local_audio_env"
group = "local_audio"
type = "float"
default = 7200.0
min = 0.0
max = 604800.0
unit = "s"
read = "startup"
tier = "tuning"
help = "With wake words: one conversation at the box lasts until it has been asleep this long. A wake within it continues where it stopped (\"what about tomorrow?\" three minutes later still knows the question) and is not greeted; after it, a new conversation starts with a greeting. The brain keeps the last conversation's messages in memory (at most 40 messages / 24k characters), for the box's own mic only; a restart of teaport-brain forgets it."
source = "local_audio.py:154"

[[settings]]
name = "LOCAL_AUDIO_BACKOFF_SECS"
store = "local_audio_env"
group = "local_audio"
type = "float"
default = 60.0
min = 0.0
max = 3600.0
unit = "s"
read = "startup"
tier = "tuning"
help = "When another client (the dashboard, grokani, a browser) has the box -- it took the session from the sleeping bridge, or the brain refused the bridge because that client's conversation is live -- the box is theirs: the bridge stops listening for a voice until the brain has had no live session for this long, so the room (or the dashboard user's own voice) does not keep asking. A bridge that starts (or restarts) while such a session is live does the same instead of dialling. An unused Talk session ends on the brain's ~5 min idle timeout, which bounds the wait. After it, the bridge waits for a voice as after any session; 0 turns the back-off off (with wake words a refused bridge then retries on a doubling wait, never at once)."
source = "local_audio.py:163"

[[settings]]
name = "LOCAL_AUDIO_URL"
store = "local_audio_env"
group = "local_audio"
type = "ws_url"
default = "ws://127.0.0.1:$BRAIN_PORT/talk"
read = "startup"
tier = "tuning"
help = "The brain's /talk WebSocket. GATEWAY_TOKEN, read from brain.env, is appended as ?token= when set."
source = "local_audio.py:119"

[[settings]]
name = "LOCAL_AUDIO_FACE_SOCK"
store = "local_audio_env"
group = "local_audio"
type = "path"
default = "/run/oled-avatar/face.sock"
read = "startup"
tier = "tuning"
help = "The OLED avatar daemon's socket (teaport-oled-avatar, `oled_face.py --serve`). The bridge sends it listening/thinking/speaking, the jaw opening from the loudness of the audio as it plays, and the reply text for its mood. No daemon there means no face; nothing else changes."
source = "local_audio.py:197"

[[settings]]
name = "LOCAL_AUDIO_FACE_ADVANCE_MS"
store = "local_audio_env"
group = "local_audio"
type = "int"
default = 50
min = 0
max = 300
unit = "ms"
read = "startup"
tier = "tuning"
help = "How early the avatar's mouth is told about the audio it is about to play, to cover its own drawing delay. Raise it if the mouth lags the voice, lower it if it leads."
source = "local_audio.py:232"

