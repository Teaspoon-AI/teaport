[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teaport-brain"
version = "0.0.0"
description = "teaport voice brain — Pipecat pipeline with heard-grounded barge-in, memory recall, and tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Every entry below is a DIRECT import somewhere in the package (the import closure of
# teaport_brain.gateway_server); transitive deps are left to the resolver.
#
# pipecat extras (1.7.0): only `websocket` is needed —
#   websocket -> pipecat.transports.websocket.fastapi (the /talk transport) + fastapi.
# The OpenAI LLM service (pipecat.services.openai.llm — the ONLY LLM service the brain
# uses) is a BASE dependency, so no `openai` extra is required; it talks to any
# OpenAI-compatible endpoint (Groq, Cerebras, OpenRouter, a local server) via LLM_BASE_URL.
# Silero VAD + Smart Turn v3 also ride base deps (onnxruntime).
#
# NOTE: pipecat-ai depends on onnxruntime unconditionally (Silero VAD + Smart Turn v3 both
# run ONNX models in THIS process) — the brain is torch-free, not onnxruntime-free.
# See THIRD_PARTY_LICENSES.md.
#
# These are the DIRECT imports of the gateway_server closure; the FULL transitive closure is
# pinned reproducibly in uv.lock (installed by install.sh phase_brain via `uv sync --frozen`),
# so the constraints here only need to express INTENT — uv.lock records the exact resolved
# versions. This retires the old "pin every direct dep from an appliance `pip freeze`"
# approach, which could not pin transitives and so drifted on every reinstall.
#
# numpy: moved to 2.x. It sat at 1.26.4 only because a lock-free `pip install` would
# otherwise pull 2.x unvalidated on a reinstall; with a lock the choice is deliberate and
# STICKS. numpy 2.x is import/ABI-validated against this set — onnxruntime 1.24.4, the
# C-extension that a numpy major bump would break, imports clean under numpy 2.5.x. websockets
# is left to pipecat's own constraint; its earlier "not reproducible via pip" caveat is moot
# now that uv.lock pins whatever pipecat resolves.
#
# httpx and openai are DIRECT imports of services.py (BoundedOpenAILLMService builds its
# own AsyncOpenAI with an httpx client whose timeout actually reaches the socket), so the
# invariant at the top of this block requires them here. They were reaching the brain only
# as transitive deps of pipecat-ai, which the comment above explicitly warns is not
# something to rely on: the note that the OpenAI service "is a BASE dependency, so no
# `openai` extra is required" is exactly the assumption that would strand the brain with an
# ImportError at startup — before any pipeline exists — if pipecat ever moved it behind an
# extra. Left UNPINNED rather than pinned to a guess: the other pins come from the
# appliance venv freeze, and pipecat-ai==1.7.0 already constrains both, so this declares
# the dependency without inventing a version. Pin them at the next freeze.
dependencies = [
  "pipecat-ai[websocket]==1.7.0",
  "uvicorn==0.49.0",
  "fastapi==0.136.3",
  "loguru==0.7.3",
  "numpy>=2,<3",
  "websockets",
  "httpx",
  "openai",
]

[project.scripts]
teaport-brain = "teaport_brain.gateway_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["teaport_brain*"]

[tool.pytest.ini_options]
# The tests/test_*.py files are standalone scripts (each has a __main__ that exits
# nonzero on failure), NOT pytest natives — test_suite.py is the gate and runs them
# one per subprocess. Collect only the aggregate: pointing pytest at the whole
# directory would otherwise also try to run their `async def test_*` helpers natively
# (unsupported without an asyncio plugin) and re-run every script twice.
testpaths = ["tests"]
python_files = ["test_suite.py"]
