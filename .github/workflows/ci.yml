name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain:
    # Both architectures, because the two answer different questions. x86 is where
    # development happens, so it is what catches a regression before it is pushed.
    # aarch64 is the ONLY architecture ever shipped to a user — a Jetson Orin — and
    # until now nothing tested it automatically: every arm64 claim in this repo came
    # from someone SSHing into the appliance and running the suite by hand, which
    # makes it true on the day it was checked and unverified every day after.
    #
    # A GitHub-hosted arm64 runner is free for public repos and the pins resolve on
    # it: pipecat-ai is py3-none-any, onnxruntime and numpy both ship manylinux
    # aarch64 wheels.
    #
    # This is not a substitute for the appliance and does not pretend to be — no
    # CUDA, no JetPack, no engine, no LLM. The two appliance-only tests skip on both
    # runners exactly as they do on a laptop, and that they SKIP rather than fail is
    # what lets a second runner be added without a denylist of its own.
    #
    # fail-fast is off on purpose: an arm-only break and an x86-only break are
    # different bugs, and cancelling the other job would hide which one you have.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the brain + pytest
        run: pip install ./brain pytest
      - name: Hermetic tests
        # No -k denylist. test_suite.py runs each test_*.py as a subprocess, and a
        # script whose dependency is absent exits appliance.SKIP_EXIT, which the
        # runner turns into a pytest skip — so the appliance-only ones (a live engine
        # WebSocket, a live LLM) report as skipped here and RUN on the appliance.
        #
        # The denylist this replaces had to be edited by hand for every new
        # appliance-dependent test, and its comment still said "the other five are
        # hermetic" when there were seventeen. A test that forgot to add itself
        # failed CI instead of skipping.
        run: python -m pytest brain/tests/test_suite.py -v

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the plugin
        working-directory: plugin
        run: npm test

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n install-bootstrap.sh
      - name: shellcheck (advisory)
        continue-on-error: true
        run: shellcheck install.sh install-bootstrap.sh
      - name: Manifest JSON is valid
        run: |
          for m in manifest/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print('ok', sys.argv[1])" "$m"
          done
      - name: Installer dry-run (voice-only path)
        # No Jetson, no sandbox, not a TTY: exercises the full dry-run without touching the box.
        run: TEAPORT_ALLOW_NON_JETSON=1 TEAPORT_MANIFEST_URL="$PWD/manifest/stable.json" bash install.sh --dry-run
