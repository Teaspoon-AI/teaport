name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain:
    # Two architectures because they answer different questions: x86 catches a
    # regression before it's pushed, aarch64 is the only architecture ever shipped (a
    # Jetson Orin) and until now nothing tested it automatically. Free on a
    # GitHub-hosted runner for a public repo — worth revisiting this matrix if that
    # ever changes. All eight direct deps in brain/pyproject.toml ship manylinux
    # aarch64 wheels for cp312 (checked 2026-08-28, pipecat-ai's own onnxruntime
    # dependency included), and actions/python-versions has a cached linux-arm64
    # 3.12 build, so setup-python below doesn't fall back to building from source.
    #
    # Not a substitute for the appliance: no CUDA, no JetPack, no engine, no LLM. The
    # two appliance-only tests SKIP here exactly as they do on a laptop — a green run
    # is x86/aarch64 hermetic coverage, not a Jetson stand-in.
    #
    # fail-fast is off: an arm-only break and an x86-only break are different bugs,
    # and cancelling one job would hide which one you have. The two legs also aren't
    # guaranteed to finish together — hosted arm64 runners can queue behind x86 —
    # so judge each leg's result on its own rather than expecting them in lockstep.
    #
    # Matrix jobs report as "brain (<runner>)", not "brain": a future branch
    # protection rule needs the per-leg name, not the bare job name.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Overrides the workflow-level concurrency group above. x86 is cheap to
    # restart, so it keeps cancel-in-progress. arm64 runners can queue behind
    # other GitHub-hosted arm64 jobs — if it shared the ref-wide group, a
    # fast-iterating PR would cancel it on every push and it could go the
    # whole PR without ever reporting a real result. Queuing instead of
    # cancelling means every push still gets checked, just later.
    concurrency:
      group: ci-brain-${{ matrix.runner }}-${{ github.ref }}
      cancel-in-progress: ${{ matrix.runner == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the brain from uv.lock (the set that ships)
        # Mirrors install.sh phase_brain, not a fresh pip resolve: --locked FAILS if
        # brain/uv.lock is stale against brain/pyproject.toml (the silent-drift case a
        # `pip install ./brain` papered over — CI green on a new resolve while every
        # appliance shipped the old lock), and --no-editable installs the same built
        # copy the appliance gets. The dev group supplies the locked pytest. uv itself
        # is pinned to the same version install.sh bootstraps.
        run: |
          pip install uv==0.9.24
          uv sync --locked --no-editable --project brain
      - name: Hermetic tests
        # No -k denylist. test_suite.py runs each test_*.py as a subprocess, and a
        # script whose dependency is absent exits appliance.SKIP_EXIT, which the
        # runner turns into a pytest skip — so the appliance-only ones (a live engine
        # WebSocket, a live LLM) report as skipped here and RUN on the appliance.
        #
        # The denylist this replaces had to be edited by hand for every new
        # appliance-dependent test, and its comment still said "the other five are
        # hermetic" when there were twenty-three. A test that forgot to add itself
        # failed CI instead of skipping.
        run: uv run --project brain python -m pytest brain/tests/test_suite.py -v

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the plugin
        working-directory: plugin
        run: npm test

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n install-bootstrap.sh
      - name: shellcheck (advisory)
        continue-on-error: true
        run: shellcheck install.sh install-bootstrap.sh
      - name: Manifest JSON is valid
        run: |
          for m in manifest/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print('ok', sys.argv[1])" "$m"
          done
      - name: Installer dry-run (voice-only path)
        # No Jetson, no sandbox, not a TTY: exercises the full dry-run without touching the box.
        run: TEAPORT_ALLOW_NON_JETSON=1 TEAPORT_MANIFEST_URL="$PWD/manifest/stable.json" bash install.sh --dry-run
