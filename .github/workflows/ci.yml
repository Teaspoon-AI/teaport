name: ci

on:
  push:
    branches: [main]
    # brain-v<X.Y.Z>: brain-deb builds the release package. It is uploaded as a run
    # artifact like any other build; publishing it is a separate, manual step.
    tags: ["brain-v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain:
    # Two architectures because they answer different questions: x86 catches a
    # regression before it's pushed, aarch64 is the only architecture ever shipped (a
    # Jetson Orin) and until now nothing tested it automatically. Free on a
    # GitHub-hosted runner for a public repo — worth revisiting this matrix if that
    # ever changes. The whole LOCKED closure, not just the eight direct deps, ships
    # manylinux aarch64 wheels for cp312 — 63 packages checked against brain/uv.lock on
    # 2026-09-06, after the pipecat 1.8.1 bump swapped scipy for the compiled
    # `loudness`; the only three without one are docopt (sdist, the one thing the
    # appliance builds), teaport-brain itself, and audioop-lts (marker-gated
    # python >= 3.13, so never installed on the cp312 appliance). actions/python-versions
    # has a cached linux-arm64 3.12 build, so setup-python below doesn't fall back to
    # building from source.
    #
    # Not a substitute for the appliance: no CUDA, no JetPack, no engine, no LLM. The
    # two appliance-only tests SKIP here exactly as they do on a laptop — a green run
    # is x86/aarch64 hermetic coverage, not a Jetson stand-in.
    #
    # fail-fast is off: an arm-only break and an x86-only break are different bugs,
    # and cancelling one job would hide which one you have. The two legs also aren't
    # guaranteed to finish together — hosted arm64 runners can queue behind x86 —
    # so judge each leg's result on its own rather than expecting them in lockstep.
    #
    # Matrix jobs report as "brain (<runner>)", not "brain": a future branch
    # protection rule needs the per-leg name, not the bare job name.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Overrides the workflow-level concurrency group above. x86 is cheap to
    # restart, so it keeps cancel-in-progress. arm64 runners can queue behind
    # other GitHub-hosted arm64 jobs — if it shared the ref-wide group, a
    # fast-iterating PR would cancel it on every push and it could go the
    # whole PR without ever reporting a real result. Queuing instead of
    # cancelling means every push still gets checked, just later.
    concurrency:
      group: ci-brain-${{ matrix.runner }}-${{ github.ref }}
      cancel-in-progress: ${{ matrix.runner == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the brain from uv.lock (the set that ships)
        # Mirrors install.sh phase_brain, not a fresh pip resolve: --locked FAILS if
        # brain/uv.lock is stale against brain/pyproject.toml (the silent-drift case a
        # `pip install ./brain` papered over — CI green on a new resolve while every
        # appliance shipped the old lock), and --no-editable installs the same built
        # copy the appliance gets. The dev group supplies the locked pytest. uv itself
        # is pinned to the same version install.sh bootstraps.
        run: |
          pip install uv==0.9.24
          uv sync --locked --no-editable --project brain
      - name: Brain self-check (what install.sh runs before swapping a venv in)
        # The same gate an appliance install applies to a freshly built venv: import both
        # front-ends and push audio through Silero VAD + Smart Turn v3, the compiled
        # extensions (onnxruntime, loudness) a numpy major would break. Here it runs on
        # the aarch64 leg too, so a lock bump that breaks them on arm fails in CI rather
        # than in an appliance's install (where it would be caught, but only then).
        # In a venv of its own built the way brain_stage builds one — --no-dev, not the
        # dev-group venv above — and run from / like install.sh runs it, so nothing the
        # tests need, and no teaport_brain/ from the checkout, can make it pass here and
        # fail on the box. `uv run` would re-sync the project venv instead.
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/brain-prod" \
            uv sync --locked --no-editable --no-dev --project brain
          cd / && "$RUNNER_TEMP/brain-prod/bin/python" -m teaport_brain.selfcheck
      - name: Hermetic tests
        # No -k denylist. test_suite.py runs each test_*.py as a subprocess, and a
        # script whose dependency is absent exits appliance.SKIP_EXIT, which the
        # runner turns into a pytest skip — so the appliance-only ones (a live engine
        # WebSocket, a live LLM) report as skipped here and RUN on the appliance.
        #
        # The denylist this replaces had to be edited by hand for every new
        # appliance-dependent test, and its comment still said "the other five are
        # hermetic" when there were twenty-three. A test that forgot to add itself
        # failed CI instead of skipping.
        run: uv run --project brain python -m pytest brain/tests/test_suite.py -v

  brain-deb:
    # The brain as a .deb (#60): built on the architecture it ships to, from the lock,
    # with the system python3.12 — the ubuntu-24.04 runner's is the appliance's own
    # release — by packaging/build-deb.sh, the script a local `packaging/build-deb.sh`
    # runs too. Then the PACKAGE is tested, not the tree it was built from: the build
    # removes /opt/teaport/brain after packaging, so what the self-check below runs is
    # exactly what `apt install` unpacked. The .deb is uploaded as a run artifact on
    # every build; nothing here publishes it.
    #
    # Versions (see build-deb.sh): <BASE_VERSION>~dev<run>+g<sha> for PRs and branches,
    # X.Y.Z for a brain-vX.Y.Z tag. A PR builds its head commit, not the merge commit
    # GitHub tests by default, so the +g<sha> names a commit you can check out.
    runs-on: ubuntu-24.04-arm
    # Same queue-don't-cancel reasoning as the brain job's arm64 leg.
    concurrency:
      group: ci-brain-deb-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the .deb
        run: |
          if [[ "$GITHUB_REF" == refs/tags/brain-v* ]]; then
            # checkout fetched the commit, not the tag; build-deb.sh checks HEAD is it.
            git fetch --no-tags --depth=1 origin "+$GITHUB_REF:$GITHUB_REF"
            export TEAPORT_DEB_VERSION="${GITHUB_REF_NAME#brain-v}"
          else
            export TEAPORT_DEB_BUILD="${{ github.run_number }}"
          fi
          packaging/build-deb.sh
          [ ! -e /opt/teaport/brain ] || { echo "the build tree was left behind"; exit 1; }
          deb="$(ls dist/teaport-brain_*.deb)"
          echo "DEB=$deb" >> "$GITHUB_ENV"
          dpkg-deb --info "$deb"
          ls -l "$deb"; sha256sum "$deb" | tee "$deb.sha256"
      - name: Install it
        run: sudo apt-get install -y "./$DEB"
      - name: Self-check the installed package
        # From /, isolated (-I), as the runner user and then as root. Root is the strict
        # case: a root python writes a __pycache__ wherever a .pyc is missing or stale,
        # which the next step would see as a file the package does not own, or as a
        # changed one. The run user on the box cannot write the tree at all, so a stale
        # .pyc there would cost a recompile on every start instead.
        run: |
          cd /
          /opt/teaport/brain/bin/python -I -m teaport_brain.selfcheck
          sudo /opt/teaport/brain/bin/python -I -m teaport_brain.selfcheck
          /opt/teaport/brain/bin/teaport-brain --help >/dev/null
          test -x /usr/bin/teaport && bash -n /usr/bin/teaport
          # compile(), not py_compile: that would write a __pycache__ beside the helper.
          /usr/bin/python3 -I -c 'import sys; p = sys.argv[1]; compile(open(p).read(), p, "exec")' /usr/lib/teaport/config_apply.py
      - name: dpkg -V is clean, and the package owns every file under its root
        run: |
          out="$(dpkg -V teaport-brain)"
          [ -z "$out" ] || { printf '%s\n' "$out"; echo "dpkg -V: files changed after install"; exit 1; }
          stray="$(comm -13 <(dpkg -L teaport-brain | sort -u) <(find /opt/teaport/brain | sort -u))"
          [ -z "$stray" ] || { printf '%s\n' "$stray" | head -50; echo "files under /opt/teaport/brain that the package does not own (written at run time?)"; exit 1; }
          echo "dpkg -V clean; $(dpkg -L teaport-brain | wc -l) paths owned"
      - name: Shared libraries (what Depends must cover)
        # Every ELF object in the venv, through ldd. Anything unresolved fails the job.
        # Anything resolved OUTSIDE the venv is a system library the package relies on:
        # listed with the Debian package that ships it and one .so that needs it, and
        # every such package must be named in the .deb's Depends: (what dpkg-shlibdeps
        # would have derived, for a package nfpm builds without it).
        run: |
          find /opt/teaport/brain -type f \( -name '*.so' -o -name '*.so.*' \) > "$RUNNER_TEMP/elfs"
          echo "$(wc -l < "$RUNNER_TEMP/elfs") shared objects in the venv"
          missing=0; : > "$RUNNER_TEMP/sys"
          while IFS= read -r f; do
            out="$(ldd "$f" 2>&1 || true)"
            if grep -q 'not found' <<<"$out"; then echo "UNRESOLVED in $f:"; grep 'not found' <<<"$out"; missing=1; fi
            awk -v so="${f#/opt/teaport/brain/lib/python3.12/site-packages/}" \
              '/=> \//{print $3, so} /^\t\/[^ ]+ \(/{print $1, so}' <<<"$out" \
              | grep -v '^/opt/teaport/brain/' >> "$RUNNER_TEMP/sys" || true
          done < "$RUNNER_TEMP/elfs"
          # dpkg -S by the path ldd printed, then by its resolved one: since the /usr
          # merge a library can be registered under either spelling. Diversion notes
          # (the dynamic loader has one) are not owners.
          owner() { { dpkg -S "$1"; dpkg -S "$(readlink -f "$1")"; } 2>/dev/null | grep -v '^diversion by' | head -1 | cut -d: -f1; }
          echo "system libraries the venv links against:"
          : > "$RUNNER_TEMP/pkgs"
          while read -r lib so; do
            pkg="$(owner "$lib" || true)"
            printf '  %-44s %-12s e.g. %s\n' "$lib" "${pkg:-?}" "$so"
            echo "${pkg:-?}" >> "$RUNNER_TEMP/pkgs"
          done < <(sort -u -k1,1 "$RUNNER_TEMP/sys")
          echo "packages: $(sort -u "$RUNNER_TEMP/pkgs" | paste -sd' ')"
          depends="$(dpkg-query -W -f='${Depends}' teaport-brain)"
          echo "Depends: $depends"
          # Package names only (version constraints dropped), matched as whole lines.
          sed 's/ *([^)]*)//g; s/, */\n/g' <<<"$depends" > "$RUNNER_TEMP/depends"
          for pkg in $(sort -u "$RUNNER_TEMP/pkgs"); do
            if ! grep -qxF "$pkg" "$RUNNER_TEMP/depends"; then echo "not in Depends: $pkg"; missing=1; fi
          done
          [ "$missing" = 0 ]
      - uses: actions/upload-artifact@v4
        with:
          name: teaport-brain-deb
          path: |
            dist/teaport-brain_*.deb
            dist/teaport-brain_*.deb.sha256
          if-no-files-found: error
          compression-level: 0 # already compressed

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the plugin
        working-directory: plugin
        run: npm test

  formal:
    # brain/formal/check.sh model-checks every row in brain/formal/*.tla and gates on
    # the expectation each row declares (see the script's header) -- an "expected:
    # holds" design that TLC finds a counterexample for, an "expected: FAILS <Prop>"
    # design that no longer fails (a lost counterexample) or now fails on a different
    # invariant, or a row with no verdict at all, all fail the job. Nothing ran this
    # automatically before now (8d3530a deferred it; #36), so a spec/cfg edit that
    # silently loses a counterexample was invisible until someone ran it by hand.
    #
    # Pinned to v1.7.4 (TLC 2.19, rev 5a47802) -- the exact jar every verdict in the
    # suite was established against -- by tag + sha256 rather than "latest", so a new
    # tlaplus release can't change a verdict here without a deliberate re-pin (and a
    # local re-run of the 60-row suite to confirm it first). Job name is plain
    # `formal` (no matrix) so a future branch-protection rule can name it directly,
    # same as the `brain (<runner>)` note above.
    runs-on: ubuntu-latest
    timeout-minutes: 30 # shared runner pays cold JVM starts x56 the local desktop didn't; see download retry below
    env:
      TLA_TAG: v1.7.4
      TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11" # TLC needs 11+; matches the desktop the suite was verified on
      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: tla2tools.jar
          key: tla2tools-${{ env.TLA_TAG }}
      - name: Download tla2tools.jar (pinned)
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --retry-connrefused -C - -o tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TAG}/tla2tools.jar"
      - name: Verify tla2tools.jar checksum
        run: echo "${TLA_SHA256}  tla2tools.jar" | sha256sum -c
      - name: Model-check every row
        run: TLA_TOOLS="$PWD/tla2tools.jar" brain/formal/check.sh

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        # The SIP rigs under brain/test are in here too. Nothing else parses them —
        # they only run on a box with a gateway — so a syntax error in the shared
        # sip_test_common.sh (which now refuses an unpinned interpreter, and so has
        # real logic in it) would otherwise first surface on the appliance.
        run: |
          bash -n install.sh
          bash -n install-bootstrap.sh
          bash -n cli/teaport
          bash -n packaging/build-deb.sh
          for f in brain/test/*.sh; do bash -n "$f"; done
      - name: shellcheck (advisory)
        continue-on-error: true
        run: shellcheck install.sh install-bootstrap.sh cli/teaport packaging/build-deb.sh brain/test/*.sh
      - name: Manifest JSON is valid
        run: |
          for m in manifest/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print('ok', sys.argv[1])" "$m"
          done
      - name: Installer dry-run (voice-only path)
        # No Jetson, no sandbox, not a TTY: exercises the full dry-run without touching the box.
        run: TEAPORT_ALLOW_NON_JETSON=1 TEAPORT_MANIFEST_URL="$PWD/manifest/stable.json" bash install.sh --dry-run
      - name: Installer dry-run (--only brain)
        # The incremental brain update path. Off-appliance it warns that there is no
        # install to update and shows the plan anyway: stage, self-check, swap, restart.
        run: bash install.sh --only brain --dry-run
