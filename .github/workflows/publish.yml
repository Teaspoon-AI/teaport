name: publish

# What get.teaspoon.tech serves from this repo: the release manifests (install.sh and
# `teaport update` read manifest/stable.json from there, not from a checkout) and the
# one-liner's bootstrap (install-bootstrap.sh, served as /teaport). Until this workflow
# they were uploaded by hand, and that step was missed: from 2026-07-24 to 2026-10-15
# the served stable.json stayed at engine 1.3 with no G2P dict while main moved to 1.6,
# so a fresh install fetched engine 1.3 and then died at the dict check.
#
# On a PR that touches them, and weekly: check that the manifests name everything
# install.sh needs and that it is all published as named (manifest/check.py). The weekly
# run catches an artifact re-uploaded under an unchanged URL (the Voxtral model's URL
# has served two different files). On main: the same check, then upload, then read each
# file back from the public URL. A manifest therefore goes up only when its artifacts
# are already in the bucket; upload the artifacts first, then merge.
#
# The upload runs in the r2-publish environment. Its secrets are read by the upload step
# only and never on pull_request. Restrict the environment's deployment branches to
# main (Settings > Environments) so no other branch's workflow can read them:
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  an R2 API token with write access to the
#                                           teaport-get bucket
#   R2_ENDPOINT                             https://<account id>.r2.cloudflarestorage.com

on:
  push:
    branches: [main]
    paths:
      - manifest/**
      - install-bootstrap.sh
      - .github/workflows/publish.yml
  pull_request:
    paths:
      - manifest/**
      - install-bootstrap.sh
      - .github/workflows/publish.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Never two uploads at once, and never cancel one halfway; a PR's newer push replaces
# its older check. The weekly check has its own group: queued behind a merge's run it
# would otherwise displace that run while it waits, and the merge would go unpublished.
concurrency:
  group: publish-${{ github.event_name == 'schedule' && 'weekly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The bootstrap parses
        # ci.yml checks it too, but publish does not wait for ci.yml.
        run: bash -n install-bootstrap.sh
      - name: The manifests name everything install.sh needs, published as named
        # Downloads every artifact (~4.6 GB, mostly the Voxtral model): a few minutes.
        run: |
          python3 manifest/check.py manifest/stable.json
          python3 manifest/check.py --placeholders-ok manifest/beta.json

  publish:
    needs: artifacts
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: r2-publish
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Only what main serves now is published
        # A re-run of an older run checks out that run's commit: uploading it would put
        # an older manifest over a newer one. So compare this commit's files with main's
        # tip: the same, and this run checked them, so publish (main may have moved on
        # with other changes, which start no run of their own). Different, and a later
        # commit changed them, so that commit's own run publishes. A failed fetch fails.
        id: tip
        run: |
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- manifest/stable.json manifest/beta.json install-bootstrap.sh; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main's tip $(git rev-parse FETCH_HEAD) has other manifests or bootstrap than ${GITHUB_SHA}: not publishing an older commit (the later commit's own run publishes)"
          fi
      - name: Upload to the download bucket
        if: steps.tip.outputs.publish == '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT are not set in the r2-publish environment: nothing was published"
            exit 1
          fi
          put() {  # put <file> <key> <content type>: the types the bucket already serves
            aws s3 cp "$1" "s3://teaport-get/$2" --endpoint-url "$R2_ENDPOINT" \
              --content-type "$3" --only-show-errors
            echo "uploaded $1 -> https://get.teaspoon.tech/$2"
          }
          put manifest/stable.json manifest/stable.json application/json
          put manifest/beta.json manifest/beta.json application/json
          put install-bootstrap.sh teaport text/x-shellscript
      - name: Read each file back from get.teaspoon.tech
        if: steps.tip.outputs.publish == '1'
        # Cloudflare serves these uncached (cf-cache-status: DYNAMIC), so this reads what
        # the bucket holds. A cache rule on the domain would make it fail here, loudly.
        run: |
          for pair in manifest/stable.json:manifest/stable.json manifest/beta.json:manifest/beta.json \
                      install-bootstrap.sh:teaport; do
            file="${pair%%:*}"; key="${pair#*:}"
            curl -fsS "https://get.teaspoon.tech/$key" | cmp - "$file" \
              || { echo "::error::https://get.teaspoon.tech/$key does not serve $file"; exit 1; }
            echo "ok https://get.teaspoon.tech/$key == $file"
          done
