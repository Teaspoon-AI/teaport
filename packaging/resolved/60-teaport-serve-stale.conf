# teaport: keep answering from the last good lookup when the network's DNS server
# stops answering. A home router's resolver can stall for tens of seconds (seen on the
# appliance 2026-10-15: systemd-resolved degrading to TCP against 192.168.1.254 while
# every new connection to the language model waited on a lookup). With this, a name
# that resolved within the last day is answered from the cache once the router's first
# attempt times out (systemd 254+, RFC 8767 "serve stale"), instead of the lookup
# failing outright. The network's own DNS server stays the one asked first.
[Resolve]
StaleRetentionSec=1d
