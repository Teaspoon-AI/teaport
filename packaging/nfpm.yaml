# nfpm recipe for teaport-brain_<version>_<arch>.deb (#60). Built by
# packaging/build-deb.sh, locally or in CI's brain-deb job; not by hand, because the
# venv under contents must first be built AT /opt/teaport/brain (a venv is not
# relocatable) and the version comes from the script.
#
# Installing it puts the brain live: postinst writes the config page's sudoers line,
# links the old /opt/teaport/venv path to the new tree and restarts the brain's units
# (packaging/deb/postinst). install.sh renders the units; this package carries what runs.
name: teaport-brain
arch: ${TEAPORT_DEB_ARCH}
platform: linux
version: ${TEAPORT_DEB_VERSION}
# Taken verbatim. The default (semver) would reparse 0.1.0~dev12+gabc123 into
# prerelease/metadata fields and rebuild it in its own spelling; the Debian ordering
# (~ sorts before the release) is the one that matters here.
version_schema: none
section: misc
priority: optional
maintainer: Teaspoon AI <stefano@teaspoon.tech>
vendor: Teaspoon AI
homepage: https://github.com/Teaspoon-AI/teaport
license: MIT
description: |-
  teaport voice brain
  The Pipecat voice pipeline (STT -> LLM -> TTS) of a teaport appliance, as a
  self-contained Python virtual environment built from brain/uv.lock against the
  system python3.12, plus the teaport operator CLI and the config page's root-run
  helper.

# The venv's compiled dependencies are manylinux wheels that bundle most of their own
# .so files. What they still load from the system, per CI's ldd of every one of them
# (the brain-deb job fails if a library's package is missing here): glibc, the GCC
# runtime (libgcc_s, libstdc++), zlib, and libgomp, the OpenMP runtime numba's thread
# pool links (numba comes in with resampy). libgomp is the one of these a minimal
# Ubuntu install lacks. Then the interpreter the venv was built on (pyvenv.cfg home =
# /usr/bin), the system python3 that runs the root-owned config helper, and curl for
# the CLI, and sudo (visudo checks the config page's sudoers line before it is installed).
# libpam-modules-bin for mkhomedir_helper, which the owner's login helper (login_apply.py)
# runs to finish an account a create left without its home directory; Ubuntu installs it
# everywhere (priority required), the line says the package needs it.
# No python3.12-venv: the venv is built in CI by uv, and nothing on the box
# creates one or runs ensurepip.
depends:
  - python3.12 (>= 3.12.3)
  - python3
  - sudo
  - libpam-modules-bin
  - curl
  - libc6
  - libgcc-s1
  - libstdc++6
  - zlib1g
  - libgomp1

umask: 0o022

scripts:
  postinstall: packaging/deb/postinst
  postremove: packaging/deb/postrm

contents:
  # The venv, byte for byte as uv built it (bytecode included, so a root-owned tree
  # never needs a __pycache__ write). Symlinks such as bin/python -> /usr/bin/python3.12
  # are kept as symlinks.
  - src: /opt/teaport/brain/
    dst: /opt/teaport/brain/
    type: tree
    file_info:
      owner: root
      group: root

  - src: cli/teaport
    dst: /usr/bin/teaport
    file_info:
      mode: 0o755
      owner: root
      group: root

  # The config page's privileged helper, run by sudo with the SYSTEM python3, never out
  # of the venv: a root-owned copy outside it (see config_apply.py's docstring).
  - src: brain/teaport_brain/config_apply.py
    dst: /usr/lib/teaport/config_apply.py
    file_info:
      mode: 0o755
      owner: root
      group: root

  # The Wi-Fi changes' privileged helper, the same way (see wifi_apply.py): every change
  # Wi-Fi setup and the config page make to NetworkManager, checked, and nothing else.
  - src: brain/teaport_brain/wifi_apply.py
    dst: /usr/lib/teaport/wifi_apply.py
    file_info:
      mode: 0o755
      owner: root
      group: root

  # The owner's login helper, the same way (see login_apply.py, #421): makes the box's
  # admin account once, on a box provisioning marked for it, and nothing else.
  - src: brain/teaport_brain/login_apply.py
    dst: /usr/lib/teaport/login_apply.py
    file_info:
      mode: 0o755
      owner: root
      group: root

  # The Wi-Fi setup polkit rule's template: sudoers-sync rewrites a rule an earlier
  # install rendered (which granted more) from it, with no install.sh run needed.
  - src: packaging/wifi-setup/50-teaport-wifi-setup.rules.in
    dst: /usr/lib/teaport/50-teaport-wifi-setup.rules.in
    file_info:
      mode: 0o644
      owner: root
      group: root

  # The license material (#60): the Debian copyright file, and the third-party summary
  # that says where the source of the LGPL parts is and how to replace them.
  - src: packaging/deb/copyright
    dst: /usr/share/doc/teaport-brain/copyright
    file_info:
      mode: 0o644
      owner: root
      group: root

  - src: THIRD_PARTY_LICENSES.md
    dst: /usr/share/doc/teaport-brain/THIRD_PARTY_LICENSES.md
    file_info:
      mode: 0o644
      owner: root
      group: root

  # The one writer of the config page's sudoers line (see the script): run by postinst
  # and by install.sh once it has rendered the unit that names the run user.
  - src: packaging/deb/sudoers-sync
    dst: /usr/lib/teaport/sudoers-sync
    file_info:
      mode: 0o755
      owner: root
      group: root

  # The root side of Wi-Fi setup, the one unit this package carries rather than install.sh
  # rendering it: it names no user or directory, and a box whose Wi-Fi setup unit predates
  # it must have it from the package alone. postinst points that old unit at it
  # (Requires=) and turns off the old unit's own root steps, so an apt or updater upgrade
  # leaves no root command reading brain.env and keeps the port-80 redirect. install.sh
  # renders the same file into /etc/systemd/system, which takes precedence.
  - src: systemd/teaport-wifi-setup-net.service.in
    dst: /usr/lib/systemd/system/teaport-wifi-setup-net.service
    file_info:
      mode: 0o644
      owner: root
      group: root
