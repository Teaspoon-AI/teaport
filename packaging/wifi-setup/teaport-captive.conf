# teaport Wi-Fi setup: on the setup network teaport-wifi-setup brings up, answer every
# name with the box, so a phone's captive-portal probe reaches the setup page and the
# phone opens it by itself. install.sh keeps this in /usr/local/lib/teaport; the unit
# copies it into /etc/NetworkManager/dnsmasq-shared.d only while it runs, because NM
# hands that directory to EVERY shared-mode dnsmasq and an option here cannot be scoped
# to one connection. 10.42.0.1 is wifi.AP_ADDRESS, pinned in the setup profile.
address=/#/10.42.0.1
