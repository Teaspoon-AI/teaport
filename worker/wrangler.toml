# teaport download gate (src/index.js). Deployed by hand from worker/, not by CI:
#
#   npx wrangler d1 create teaport-gate            # once: put its id in database_id below
#   npx wrangler d1 migrations apply teaport-gate --remote
#   npx wrangler secret put TOKEN_KEY              # once: openssl rand -hex 32
#   npx wrangler secret put CHECK_TOKEN            # once: openssl rand -hex 32, also the repo's DL_CHECK_TOKEN secret
#   npx wrangler deploy
#
# Switchover (packaging/RELEASING.md): deployed with GATE = "open", which serves an
# anonymous download (x-teaport-gate: open). Next, delete teaport-get's dl/engine/* and
# dl/models/* (a copy there is served around these routes at a percent-encoded path), then
# merge the installer that accepts through this Worker. Then a follow-up PR sets
# GATE = "enforce" and deploys it; only from then does an anonymous download answer 401.
# The routes put this Worker in front of get.teaspoon.tech for /api/* and the gated
# download paths only; everything else there is still the public bucket teaport-get.
name = "teaport-download-gate"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "get.teaspoon.tech/api/*", zone_name = "teaspoon.tech" },
  { pattern = "get.teaspoon.tech/dl/engine/*", zone_name = "teaspoon.tech" },
  { pattern = "get.teaspoon.tech/dl/models/*", zone_name = "teaspoon.tech" },
]

[vars]
# "enforce": a download needs a token. "open": one without an Authorization header is
# served too, for the switchover only (src/index.js). Unset, or anything else, enforces.
GATE = "open"
# Acceptances and downloads older than this are deleted daily. 2557 days, 7 years: a
# PROPOSAL to confirm with counsel (docs/engine-license-data.md); change both together.
RETENTION_DAYS = "2557"

[triggers]
crons = ["17 4 * * *"]   # daily, 04:17 UTC: the retention cron

# The gated files: private, no public URL. Only this Worker reads it.
[[r2_buckets]]
binding = "DIST"
bucket_name = "teaport-engine-dist"

# The public bucket, read for manifest/<channel>.json: which license is current.
[[r2_buckets]]
binding = "PUBLIC"
bucket_name = "teaport-get"

[[d1_databases]]
binding = "DB"
database_name = "teaport-gate"
database_id = "b0da844a-354c-4907-bdcc-11b94c7630db"
migrations_dir = "migrations"

# /api/accept and /api/token: 20 requests a minute per IP address.
[[ratelimits]]
name = "ACCEPT_LIMIT"
namespace_id = "4301"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
